name = "huaxue-news"
compatibility_date = "2024-01-01"
pages_build_output_dir = "."

# D1 数据库绑定(订阅 + 用户数据)
[[d1_databases]]
binding = "DB"
database_name = "chem-agent-db"
database_id = "YOUR_D1_DATABASE_ID"

# R2 存储绑定(论文附件缓存)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "chem-agent-cache"

# Cron Trigger:在 Cloudflare Pages 控制台 Settings -> Functions -> Cron Triggers 中配置
# 表达式: 0 */6 * * * (每6小时检查一次订阅更新)
# 对应函数: functions/cron/check-updates.js

[vars]
DEEPSEEK_MODEL = "deepseek-chat"
