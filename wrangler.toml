name = "huaxue-news"
compatibility_date = "2024-01-01"
pages_build_output_dir = "."

# D1 数据库(订阅 + 用户数据)
[[d1_databases]]
binding = "DB"
database_name = "chem-agent-db"
database_id = "87a97ddd-124b-4916-8420-e1e978635db1"

# R2 存储(论文附件缓存) - 创建后取消注释
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "chem-agent-cache"

# 订阅监控定时任务(Cloudflare Pages Functions 不支持原生 Cron Triggers):
# 由独立 Worker cron-worker/(huaxue-news-cron)每 6 小时 POST /cron/check-updates 触发
# 定时器配置见 cron-worker/wrangler.toml(表达式 0 */6 * * *)

[vars]
DEEPSEEK_MODEL = "deepseek-chat"
