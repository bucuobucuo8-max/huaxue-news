name = "huaxue-news"
compatibility_date = "2024-01-01"
pages_build_output_dir = "."

# === 以下配置需要你在 Cloudflare 控制台创建对应资源后启用 ===

# D1 数据库(订阅 + 用户数据)
# 1. 控制台创建 D1: npx wrangler d1 create chem-agent-db
# 2. 将返回的 database_id 填入下方
# 3. 执行迁移: npx wrangler d1 execute chem-agent-db --file=migrations/0001_init.sql
# [[d1_databases]]
# binding = "DB"
# database_name = "chem-agent-db"
# database_id = "填入你的D1_ID"

# R2 存储(论文附件缓存)
# npx wrangler r2 bucket create chem-agent-cache
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "chem-agent-cache"

# Cron Trigger:在 Cloudflare Pages 控制台 Settings -> Functions -> Cron Triggers 中配置
# 表达式: 0 */6 * * * (每6小时检查一次订阅更新)
# 对应函数: functions/cron/check-updates.js

[vars]
DEEPSEEK_MODEL = "deepseek-chat"
