<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>化学新闻快讯</title>
<style>
  :root {
    --text: #eef7ff;
    --muted: rgba(210, 232, 255, 0.68);
    --line: rgba(125, 211, 252, 0.20);
    --card: rgba(8, 18, 34, 0.58);
    --card-strong: rgba(10, 24, 46, 0.72);
    --cyan: #67e8f9;
    --blue: #38bdf8;
    --violet: #a78bfa;
    --gold: #fbbf24;
    --danger: #fb7185;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(56, 189, 248, 0.16), transparent 32%),
      radial-gradient(circle at 80% 18%, rgba(167, 139, 250, 0.14), transparent 34%),
      linear-gradient(180deg, #030712 0%, #07111f 48%, #030712 100%);
  }

  /* Three.js 全屏背景画布：最底层 + 事件穿透 */
  #bg-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    opacity: 0.82;
  }

  /* 前景新闻内容层 */
  .page {
    position: relative;
    z-index: 2;
    width: min(920px, calc(100% - 32px));
    margin: 0 auto;
    padding: 34px 0 70px;
    user-select: text;
  }

  .hero {
    padding: 34px 28px 26px;
    border: 1px solid rgba(103, 232, 249, 0.20);
    border-radius: 28px;
    background: linear-gradient(135deg, rgba(8, 20, 40, 0.72), rgba(15, 23, 42, 0.44));
    box-shadow: 0 24px 70px rgba(2, 8, 23, 0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    color: #bff6ff;
    background: rgba(14, 165, 233, 0.12);
    border: 1px solid rgba(103, 232, 249, 0.22);
    font-size: 12px;
    letter-spacing: 0.18em;
  }
  h1 {
    margin-top: 16px;
    font-size: clamp(34px, 6vw, 64px);
    line-height: 1.02;
    letter-spacing: 0.02em;
    text-shadow: 0 0 28px rgba(56, 189, 248, 0.24);
  }
  .hero p {
    margin-top: 14px;
    max-width: 720px;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.9;
  }

  .today-card {
    margin-top: 18px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 14px;
    align-items: start;
    padding: 16px 18px;
    border-radius: 20px;
    background: rgba(2, 6, 23, 0.34);
    border: 1px solid rgba(148, 163, 184, 0.14);
  }
  .today-date {
    white-space: nowrap;
    color: #e0f2fe;
    font-weight: 800;
    letter-spacing: 0.04em;
  }
  .today-summary {
    color: var(--muted);
    line-height: 1.8;
    font-size: 14px;
  }
  .today-summary strong { color: #fff; }

  .filters {
    position: sticky;
    top: 12px;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 22px 0 24px;
    padding: 12px;
    border-radius: 22px;
    background: rgba(3, 10, 22, 0.62);
    border: 1px solid rgba(103, 232, 249, 0.14);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .filter-btn {
    appearance: none;
    border: 1px solid rgba(148, 163, 184, 0.22);
    background: rgba(15, 23, 42, 0.52);
    color: rgba(226, 246, 255, 0.78);
    border-radius: 999px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: transform .18s ease, border-color .18s ease, background .18s ease, color .18s ease, box-shadow .18s ease;
  }
  .filter-btn:hover {
    transform: translateY(-1px);
    border-color: rgba(103, 232, 249, 0.58);
    color: #fff;
  }
  .filter-btn.active {
    color: #03101d;
    background: linear-gradient(135deg, #67e8f9, #38bdf8);
    border-color: transparent;
    box-shadow: 0 10px 30px rgba(56, 189, 248, 0.28);
  }

  .timeline {
    position: relative;
    padding-left: 34px;
  }
  .timeline::before {
    content: "";
    position: absolute;
    left: 10px;
    top: 6px;
    bottom: 10px;
    width: 2px;
    background: linear-gradient(180deg, transparent, rgba(103, 232, 249, 0.58), rgba(167, 139, 250, 0.35), transparent);
    box-shadow: 0 0 18px rgba(56, 189, 248, 0.22);
  }
  .news-item {
    position: relative;
    display: grid;
    grid-template-columns: 74px 1fr;
    gap: 14px;
    padding: 0 0 18px;
  }
  .news-item::before {
    content: "";
    position: absolute;
    left: -29px;
    top: 20px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #67e8f9;
    box-shadow: 0 0 0 5px rgba(103, 232, 249, 0.12), 0 0 18px rgba(103, 232, 249, 0.45);
  }
  .news-item.important::before {
    width: 18px;
    height: 18px;
    left: -32px;
    top: 17px;
    background: #fb7185;
    box-shadow: 0 0 0 7px rgba(251, 113, 133, 0.13), 0 0 28px rgba(251, 113, 133, 0.58);
  }
  .news-time {
    padding-top: 18px;
    color: rgba(191, 246, 255, 0.78);
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.08em;
  }
  .news-card {
    min-width: 0;
    border-radius: 24px;
    padding: 18px 20px;
    background: var(--card);
    border: 1px solid rgba(148, 163, 184, 0.16);
    box-shadow: 0 18px 45px rgba(2, 8, 23, 0.34), inset 0 1px 0 rgba(255,255,255,0.06);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .news-item.important .news-card {
    background: var(--card-strong);
    border-color: rgba(251, 113, 133, 0.34);
    box-shadow: 0 20px 55px rgba(80, 7, 36, 0.22), 0 0 0 1px rgba(251, 113, 133, 0.10), inset 0 1px 0 rgba(255,255,255,0.07);
  }
  .meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 4px 10px;
    color: #03101d;
    font-size: 12px;
    font-weight: 950;
    letter-spacing: 0.08em;
  }
  .tag.award { background: linear-gradient(135deg, #fde68a, #f59e0b); }
  .tag.product { background: linear-gradient(135deg, #86efac, #22c55e); }
  .tag.company { background: linear-gradient(135deg, #93c5fd, #3b82f6); }
  .tag.research { background: linear-gradient(135deg, #c4b5fd, #8b5cf6); }
  .important-badge {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 4px 10px;
    color: #ffe4e6;
    background: rgba(251, 113, 133, 0.14);
    border: 1px solid rgba(251, 113, 133, 0.38);
    font-size: 12px;
    font-weight: 950;
    letter-spacing: 0.12em;
  }
  .news-card h2 {
    font-size: clamp(18px, 2.4vw, 24px);
    line-height: 1.35;
    margin-bottom: 8px;
  }
  .news-card p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.9;
  }
  .card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed rgba(148, 163, 184, 0.18);
  }
  .source {
    color: rgba(224, 242, 254, 0.72);
    font-size: 13px;
  }
  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #07111f;
    text-decoration: none;
    border-radius: 999px;
    padding: 8px 13px;
    background: linear-gradient(135deg, #bae6fd, #67e8f9);
    font-size: 13px;
    font-weight: 950;
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .source-link:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 26px rgba(103, 232, 249, 0.22);
  }
  .empty {
    display: none;
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    border: 1px dashed rgba(148, 163, 184, 0.22);
    border-radius: 22px;
    background: rgba(2, 6, 23, 0.28);
  }

  @media (max-width: 640px) {
    .page { width: min(100% - 20px, 920px); padding-top: 18px; }
    .hero { padding: 24px 18px 20px; border-radius: 22px; }
    .today-card { grid-template-columns: 1fr; }
    .filters { top: 8px; gap: 8px; padding: 10px; }
    .filter-btn { padding: 8px 12px; font-size: 12px; }
    .timeline { padding-left: 26px; }
    .timeline::before { left: 7px; }
    .news-item { grid-template-columns: 1fr; gap: 4px; }
    .news-item::before { left: -23px; }
    .news-item.important::before { left: -26px; }
    .news-time { padding-top: 0; }
    .news-card { padding: 16px; border-radius: 20px; }
    .card-foot { align-items: stretch; flex-direction: column; }
    .source-link { justify-content: center; }
  }
</style>
</head>
<body>
<canvas id="bg-canvas" aria-hidden="true"></canvas>

<main class="page">
  <header class="hero">
    <span class="eyebrow">CHEMISTRY BRIEF · TIMELINE</span>
    <h1>化学新闻快讯</h1>
    <p>面向化学专业学生、化工与材料研究员的每日精简资讯页。用一条纵向时间轴压缩当天化学动态，优先识别真正值得点开来源的重要事件。</p>
    <section class="today-card" aria-label="今日摘要">
      <div class="today-date" id="todayDate">--</div>
      <div class="today-summary" id="todaySummary">今日摘要加载中……</div>
    </section>
  </header>

  <nav class="filters" aria-label="新闻分类筛选">
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="award">奖项</button>
    <button class="filter-btn" data-filter="product">产品</button>
    <button class="filter-btn" data-filter="company">公司</button>
    <button class="filter-btn" data-filter="research">研究</button>
  </nav>

  <section class="timeline" id="timeline" aria-label="化学新闻时间轴"></section>
  <div class="empty" id="emptyState">当前分类暂无新闻。</div>
</main>

<script>
/* =========================
   1) 假数据区：后续只改这里即可替换新闻
   ========================= */

    summary: "公司表示新装置将电加热与催化剂再生流程耦合，目标是把基础烯烃生产碳排放继续下移。中试数据将用于评估未来十年欧洲化工园区改造路线。",
    source: "BASF",
    url: "https://www.basf.com/global/en/media/news-releases",
    important: false
  },
  {
    time: "08:20",
    type: "product",
    title: "陶氏推出可回收交联聚乙烯包装材料",

    source: "Dow",
    url: "https://www.dow.com/en-us/news/press-releases.html",

  },
  {

    summary: "研究人员利用原位显微谱学追踪晶界附近离子迁移路径，观察到局部应力与传输阻塞的直接关联。该结果为高倍率固态电池界面设计提供了新的结构依据。",
    source: "Science",
    url: "https://www.science.org/journal/science",

  },

    title: "药明康德扩建连续流化学工艺开发平台",

  {

    source: "LG Chem",
    url: "https://www.lgchem.com/main/index",
    important: false
  }
];

/* =========================
   2) 前景新闻渲染与筛选
   ========================= */
const timelineEl = document.getElementById("timeline");
const emptyEl = document.getElementById("emptyState");
const summaryEl = document.getElementById("todaySummary");
const dateEl = document.getElementById("todayDate");

function formatToday() {
  const now = new Date();
  const week = ["日", "一", "二", "三", "四", "五", "六"][now.getDay()];
  return `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 · 星期${week}`;
}

function renderSummary() {
  const importantCount = NEWS.filter(item => item.important).length;
  summaryEl.innerHTML = `今日共整理 <strong>${NEWS.length}</strong> 条化学资讯，其中 <strong>${importantCount}</strong> 条被标记为重要。建议按时间顺序快速扫读，再对重要节点点击“查看来源”。`;
}

function newsTemplate(item) {
  return `
    <article class="news-item ${item.important ? "important" : ""}" data-type="${item.type}">
      <div class="news-time">${item.time}</div>
      <div class="news-card">
        <div class="meta">
          <span class="tag ${item.type}">${CATEGORY_LABEL[item.type]}</span>
          ${item.important ? `<span class="important-badge">重要</span>` : ""}
        </div>
        <h2>${item.title}</h2>
        <p>${item.summary}</p>
        <div class="card-foot">
          <span class="source">来源：${item.source}</span>
          <a class="source-link" href="${item.url}" target="_blank" rel="noopener noreferrer">查看来源 ↗</a>
        </div>
      </div>
    </article>
  `;
}

function renderNews(filter = "all") {
  const list = filter === "all" ? NEWS : NEWS.filter(item => item.type === filter);
  timelineEl.innerHTML = list.map(newsTemplate).join("");
  emptyEl.style.display = list.length ? "none" : "block";
}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderNews(btn.dataset.filter);
  });
});

dateEl.textContent = formatToday();
renderSummary();
renderNews("all");
</script>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
/* =========================
   3) Three.js 深空网格涟漪背景
   可调变量集中在这里：幅度、速度、密度、亮度
   ========================= */
(function initTechBackground() {
  if (!window.THREE) return;

  const BG = {
    gridSize: 150,          // 网格平面尺寸
    gridSegments: 96,       // 顶点细分；过高会影响性能
    gridDensity: 0.16,      // 片元网格密度
    lineWidth: 0.035,       // 网格线宽
    baseBrightness: 0.55,   // 基础发光亮度
    sweepSpeed: 10.0,       // 流光扫过速度
    sweepWidth: 0.075,      // 流光宽度
    rippleAmp: 0.42,        // 涟漪顶点位移幅度
    rippleSpeed: 5.2,       // 涟漪扩散速度
    rippleFrequency: 0.46,  // 涟漪空间频率
    rippleFade: 0.9,        // 涟漪时间衰减
    rippleSharpness: 0.48,  // 涟漪光环锐度；越大越窄
    maxRipples: 8           // 同屏最大涟漪数量
  };

  const canvas = document.getElementById("bg-canvas");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 500);
  camera.position.set(0, 24, 34);
  camera.lookAt(0, 0, 0);

  const uniforms = {
    uTime: { value: 0 },
    uGridDensity: { value: BG.gridDensity },
    uLineWidth: { value: BG.lineWidth },
    uBaseBrightness: { value: BG.baseBrightness },
    uSweepSpeed: { value: BG.sweepSpeed },
    uSweepWidth: { value: BG.sweepWidth },
    uRippleAmp: { value: BG.rippleAmp },
    uRippleSpeed: { value: BG.rippleSpeed },
    uRippleFrequency: { value: BG.rippleFrequency },
    uRippleFade: { value: BG.rippleFade },
    uRippleSharpness: { value: BG.rippleSharpness },
    uRipples: { value: Array.from({ length: BG.maxRipples }, () => new THREE.Vector4(0, 0, -999, 0)) }
  };

  const material = new THREE.ShaderMaterial({
    uniforms,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: `
      uniform float uTime;
      uniform float uRippleAmp;
      uniform float uRippleSpeed;
      uniform float uRippleFrequency;
      uniform float uRippleFade;
      uniform vec4 uRipples[${BG.maxRipples}];
      varying vec3 vWorld;
      varying float vRipple;

      void main() {
        vec3 p = position;
        float lift = 0.0;
        float glow = 0.0;
        for (int i = 0; i < ${BG.maxRipples}; i++) {
          vec4 r = uRipples[i];
          float age = uTime - r.z;
          if (age > 0.0) {
            float d = distance(p.xy, r.xy);
            float radius = age * uRippleSpeed;
            float envelope = exp(-age * uRippleFade) * r.w;
            lift += sin(d * uRippleFrequency - age * 7.0) * envelope * uRippleAmp;
            glow += exp(-abs(d - radius) * 2.4) * envelope;
          }
        }
        p.z += lift;

    fragmentShader: `
      precision highp float;
      uniform float uTime;
      uniform float uGridDensity;
      uniform float uLineWidth;
      uniform float uBaseBrightness;
      uniform float uSweepSpeed;
      uniform float uSweepWidth;
      uniform float uRippleSpeed;
      uniform float uRippleFade;
      uniform float uRippleSharpness;
      uniform vec4 uRipples[${BG.maxRipples}];
      varying vec3 vWorld;
      varying float vRipple;

      float gridLine(vec2 uv, float width) {
        vec2 g = abs(fract(uv) - 0.5);
        float d = min(g.x, g.y);
        return 1.0 - smoothstep(0.0, width, d);
      }

      void main() {
        vec2 coord = vWorld.xz * uGridDensity;
        float fine = gridLine(coord, uLineWidth);
        float major = gridLine(coord * 0.2, uLineWidth * 1.7);

        float sweepX = mod(uTime * uSweepSpeed, 170.0) - 85.0;
        float sweep = exp(-abs(vWorld.x - sweepX) * uSweepWidth);

        color += cyan * rippleGlow * 0.95;

        gl_FragColor = vec4(color, alpha * fade);

  // 创建苯环（6 个碳原子 + 连接键）
  function makeBenzeneRing(scale = 1) {

  // 创建 DNA 双螺旋
  function makeDNAHelix(scale = 1) {
    const g = new THREE.Group();

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();

        for (let i = 0; i < ripples.length; i++) {
          const r = ripples[i];
          const age = t - r.z;
          if (age > 0 && age < 4) {
            const dx = bx - r.x;
            const dz = bz - r.y;
            const dist = Math.sqrt(dx * dx + dz * dz);
            const radius = age * BG.rippleSpeed;
            const bandDist = Math.abs(dist - radius);
            // 涟漪环宽度范围内受影响
            if (bandDist < 3.5) {
              const envelope = Math.exp(-age * BG.rippleFade) * r.w;
              const band = Math.exp(-bandDist * 0.6) * envelope;
              // 垂直起伏
              yOff += Math.sin(dist * BG.rippleFrequency - age * 7.0) * band * 1.8;
              // 水平推力：朝向页面中心 (0,0)
              const dirLen = Math.sqrt(bx * bx + bz * bz);
              if (dirLen > 0.01) {
                const push = band * 0.8;
                xOff -= (bx / dirLen) * push;
                zOff -= (bz / dirLen) * push;
              }
            }
          }
        }
        el.position.x = bx + xOff;
        el.position.z = bz + zOff;
      } else {
        el.position.x = ud.baseX;
        el.position.z = ud.baseZ;
      }

      el.position.y = ud.baseY + yOff;

      // 旋转
      if (ud.rotSpeed) {
        el.rotation.y += ud.rotSpeed * 0.01;
        el.rotation.x += ud.rotSpeed * 0.006;
      }

      // 电子轨道动画
      if (ud.hasElectrons) {
        el.children.forEach(child => {
          const cd = child.userData;
          if (cd && cd.orbitR !== undefined) {
            const ang = t * cd.orbitSpeed + cd.orbitPhase;
            const x = Math.cos(ang) * cd.orbitR;
            const z = Math.sin(ang) * cd.orbitR;
            // 应用轨道倾斜
            const tilt = cd.orbitTilt;
            const cy = x * Math.sin(tilt[0]) + z * Math.sin(tilt[2]);
            const cx = x * Math.cos(tilt[0]) + z * Math.sin(tilt[1]);
            const cz = z * Math.cos(tilt[2]) - x * Math.sin(tilt[1]);
            child.position.set(cx, cy, cz);
          }
        });
      }
    });

    renderer.render(scene, camera);
  }
  animate();
})();
</script>
