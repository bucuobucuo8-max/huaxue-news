<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>化学新闻快讯</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bg-canvas" aria-hidden="true"></canvas>

<main class="page">
  <header class="hero">
    <div class="hero-content">
      <div class="hero-left">
        <span class="eyebrow">CHEMISTRY BRIEF · DAILY</span>
        <h1>化学新闻快讯</h1>
        <p>面向化学专业学生、化工与材料研究员的每日精简资讯。瀑布流排列,优先识别值得点开的重要事件。</p>
      </div>
      <div class="hero-stats" id="heroStats">
        <!-- JS动态填充:今日统计可视化 -->
      </div>
    </div>
    <nav class="filters" aria-label="新闻分类筛选">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="award">奖项</button>
      <button class="filter-btn" data-filter="product">产品</button>
      <button class="filter-btn" data-filter="company">公司</button>
      <button class="filter-btn" data-filter="research">研究</button>
    </nav>
  </header>
  <section class="masonry" id="masonry" aria-label="化学新闻瀑布流"></section>
  <div class="empty" id="emptyState">当前分类暂无新闻。</div>
</main>

<script src="data.js"></script>
<script src="main.js"></script>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="background.js"></script>
</body>
</html>
