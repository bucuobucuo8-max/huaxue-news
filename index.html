<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>化学新闻快讯</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bg-canvas" aria-hidden="true"></canvas>

<main class="page">
  <header class="hero">
    <div class="hero-content">
      <div class="hero-left">
        <span class="eyebrow">CHEMISTRY BRIEF · DAILY</span>
        <h1>化学新闻快讯</h1>
        <p>面向化学专业学生、化工与材料研究员的每日精简资讯。瀑布流排列,优先识别值得点开的重要事件。</p>
      </div>
      <div class="hero-stats" id="heroStats">
        <!-- JS动态填充:今日统计可视化 -->
      </div>
    </div>
    <div class="hero-banner">
      <svg class="banner-svg" viewBox="0 0 600 360" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <defs>
          <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
            <stop offset="0%" stop-color="#0a1a3a" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
          </radialGradient>
          <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#67e8f9"/>
            <stop offset="100%" stop-color="#38bdf8"/>
          </linearGradient>
          <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a78bfa"/>
            <stop offset="100%" stop-color="#8b5cf6"/>
          </linearGradient>
          <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fb7185"/>
            <stop offset="100%" stop-color="#f43f5e"/>
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <rect width="600" height="360" fill="url(#bgGlow)"/>
        <!-- 中央苯环 -->
        <g transform="translate(300,180)" filter="url(#glow)" class="banner-spin">
          <polygon points="0,-70 61,-35 61,35 0,70 -61,35 -61,-35" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5"/>
          <circle cx="0" cy="-70" r="8" fill="url(#cyanGrad)"/>
          <circle cx="61" cy="-35" r="8" fill="url(#cyanGrad)"/>
          <circle cx="61" cy="35" r="8" fill="url(#cyanGrad)"/>
          <circle cx="0" cy="70" r="8" fill="url(#cyanGrad)"/>
          <circle cx="-61" cy="35" r="8" fill="url(#cyanGrad)"/>
          <circle cx="-61" cy="-35" r="8" fill="url(#cyanGrad)"/>
          <circle cx="0" cy="0" r="30" fill="none" stroke="url(#violetGrad)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
        </g>
        <!-- 左侧水分子 H2O -->
        <g transform="translate(120,120)" filter="url(#glow)" class="banner-float1">
          <circle cx="0" cy="0" r="14" fill="url(#coralGrad)" opacity="0.85"/>
          <circle cx="28" cy="18" r="8" fill="url(#cyanGrad)" opacity="0.7"/>
          <circle cx="-28" cy="18" r="8" fill="url(#cyanGrad)" opacity="0.7"/>
          <line x1="0" y1="0" x2="28" y2="18" stroke="#93c5fd" stroke-width="2" opacity="0.5"/>
          <line x1="0" y1="0" x2="-28" y2="18" stroke="#93c5fd" stroke-width="2" opacity="0.5"/>
        </g>
        <!-- 右侧 CO2 分子 -->
        <g transform="translate(480,130)" filter="url(#glow)" class="banner-float2">
          <circle cx="0" cy="0" r="12" fill="url(#violetGrad)" opacity="0.85"/>
          <circle cx="40" cy="0" r="10" fill="url(#coralGrad)" opacity="0.75"/>
          <circle cx="-40" cy="0" r="10" fill="url(#coralGrad)" opacity="0.75"/>
          <line x1="0" y1="0" x2="40" y2="0" stroke="#93c5fd" stroke-width="2" opacity="0.5"/>
          <line x1="0" y1="0" x2="-40" y2="0" stroke="#93c5fd" stroke-width="2" opacity="0.5"/>
        </g>
        <!-- 底部甲烷 CH4 -->
        <g transform="translate(150,280)" filter="url(#glow)" class="banner-float1">
          <circle cx="0" cy="0" r="13" fill="url(#violetGrad)" opacity="0.8"/>
          <circle cx="30" cy="-20" r="7" fill="url(#cyanGrad)" opacity="0.7"/>
          <circle cx="-30" cy="-20" r="7" fill="url(#cyanGrad)" opacity="0.7"/>
          <circle cx="30" cy="20" r="7" fill="url(#cyanGrad)" opacity="0.7"/>
          <circle cx="-30" cy="20" r="7" fill="url(#cyanGrad)" opacity="0.7"/>
          <line x1="0" y1="0" x2="30" y2="-20" stroke="#c4b5fd" stroke-width="1.5" opacity="0.4"/>
          <line x1="0" y1="0" x2="-30" y2="-20" stroke="#c4b5fd" stroke-width="1.5" opacity="0.4"/>
          <line x1="0" y1="0" x2="30" y2="20" stroke="#c4b5fd" stroke-width="1.5" opacity="0.4"/>
          <line x1="0" y1="0" x2="-30" y2="20" stroke="#c4b5fd" stroke-width="1.5" opacity="0.4"/>
        </g>
        <!-- 右下DNA螺旋 -->
        <g transform="translate(460,270)" filter="url(#glow)" class="banner-float2">
          <path d="M -20,-30 Q 0,-15 20,0 Q 0,15 -20,30" fill="none" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.6"/>
          <path d="M 20,-30 Q 0,-15 -20,0 Q 0,15 20,30" fill="none" stroke="url(#violetGrad)" stroke-width="2" opacity="0.6"/>
          <line x1="-15" y1="-22" x2="15" y2="-22" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>
          <line x1="-12" y1="0" x2="12" y2="0" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>
          <line x1="-15" y1="22" x2="15" y2="22" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>
        </g>
        <!-- 散布的化学式文字 -->
        <text x="80" y="50" fill="#67e8f9" opacity="0.15" font-size="18" font-family="monospace">C₆H₆</text>
        <text x="430" y="55" fill="#a78bfa" opacity="0.15" font-size="16" font-family="monospace">CH₄</text>
        <text x="250" y="330" fill="#fb7185" opacity="0.12" font-size="20" font-family="monospace">CO₂</text>
        <text x="520" y="320" fill="#67e8f9" opacity="0.15" font-size="14" font-family="monospace">H₂O</text>
      </svg>
    </div>
    <nav class="filters" aria-label="新闻分类筛选">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="award">奖项</button>
      <button class="filter-btn" data-filter="product">产品</button>
      <button class="filter-btn" data-filter="company">公司</button>
      <button class="filter-btn" data-filter="research">研究</button>
    </nav>
  </header>
  <section class="news-grid" id="masonry" aria-label="化学新闻"></section>
  <div class="empty" id="emptyState">当前分类暂无新闻。</div>
</main>

<script src="data.js"></script>
<script src="main.js"></script>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="background.js"></script>
</body>
</html>
