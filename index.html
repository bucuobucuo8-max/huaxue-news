<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>化学智能体工作台 · Chemistry Agent</title>
<script>
// MathJax 配置:加载 mhchem 扩展以支持 \ce{} 化学方程式
window.MathJax = {
  loader: { load: ['[tex]/mhchem'] },
  tex: {
    packages: { '[+]': ['mhchem'] },
    inlineMath: [['\\(', '\\)']],
    displayMath: [['\\[', '\\]']],
  },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
<style>
/* ================= 全局变量与基础 ================= */
:root {
  --text: #eef7ff;
  --muted: rgba(210, 232, 255, 0.66);
  --cyan: #67e8f9;
  --violet: #a78bfa;
  --coral: #fb7185;
  --card-bg: rgba(8, 18, 34, 0.55);
  --card-border: rgba(125, 211, 252, 0.18);
  --news-w: 460px; /* 新闻面板宽度(可拖拽调整) */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; scroll-behavior: smooth; background: #02030a; }
body {
  height: 100vh;
  overflow: hidden;
  isolation: isolate;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: transparent;
  user-select: text;
}
/* 深空底色 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(circle at 16% 8%, rgba(16, 83, 150, 0.25), transparent 38%),
    radial-gradient(circle at 82% 19%, rgba(70, 38, 119, 0.22), transparent 42%),
    radial-gradient(circle at 52% 88%, rgba(8, 56, 94, 0.18), transparent 46%),
    linear-gradient(155deg, rgba(6, 16, 31, 0.48) 0%, rgba(7, 8, 23, 0.56) 44%, rgba(1, 2, 8, 0.64) 100%);
}
#bg-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -2;
  pointer-events: none;
  opacity: 0.86;
}
/* 鼠标波纹特效层:浮于所有面板之上,不拦截任何交互 */
#fx-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 60;
  pointer-events: none;
}

/* ================= 整体框架:顶栏 + 工作区 ================= */
.app { display: flex; flex-direction: column; height: 100vh; }
.topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 22px;
  border-bottom: 1px solid rgba(125, 211, 252, 0.14);
  background: rgba(3, 8, 20, 0.6);
  backdrop-filter: blur(14px) saturate(120%);
  -webkit-backdrop-filter: blur(14px) saturate(120%);
  z-index: 30;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.08em;
  background: linear-gradient(90deg, #cffafe, #7dd3fc, #a78bfa);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  white-space: nowrap;
}
.brand-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 10px rgba(103, 232, 249, 0.8);
  -webkit-text-fill-color: initial;
}
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.stats-chip {
  font-size: 12px;
  color: var(--muted);
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid rgba(103, 232, 249, 0.18);
  background: rgba(8, 18, 34, 0.5);
  white-space: nowrap;
}
.stats-chip b { color: var(--cyan); }
.news-toggle {
  appearance: none;
  border: 1px solid rgba(103, 232, 249, 0.4);
  background: rgba(103, 232, 249, 0.12);
  color: var(--cyan);
  border-radius: 12px;
  padding: 8px 18px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s ease;
  white-space: nowrap;
}
.news-toggle:hover { color: #fff; background: linear-gradient(135deg, #67e8f9, #a78bfa); border-color: transparent; box-shadow: 0 6px 18px rgba(103, 232, 249, 0.3); }
.news-toggle.open { color: #fff; background: linear-gradient(135deg, #67e8f9, #a78bfa); border-color: transparent; }

.workspace { flex: 1; display: flex; min-height: 0; position: relative; }

/* ================= Agent 工作台(页面默认主体) ================= */
.agent {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 20px clamp(16px, 4vw, 56px) 16px;
  gap: 14px;
}
.chat-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  border-radius: 18px;
  border: 1px solid rgba(125, 211, 252, 0.14);
  background: rgba(3, 8, 20, 0.45);
  backdrop-filter: blur(16px) saturate(120%);
  -webkit-backdrop-filter: blur(16px) saturate(120%);
  box-shadow: 0 22px 70px rgba(0, 0, 0, 0.22);
}
.chat-inner {
  max-width: 860px;
  margin: 0 auto;
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.msg { display: flex; }
.msg.user { justify-content: flex-end; }
.bubble {
  max-width: 78%;
  padding: 13px 17px;
  font-size: 14.5px;
  line-height: 1.8;
  border-radius: 16px;
  user-select: text;
  word-break: break-word;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.msg.user .bubble {
  background: rgba(167, 139, 250, 0.16);
  border: 1px solid rgba(167, 139, 250, 0.4);
  border-bottom-right-radius: 6px;
  color: #ede9fe;
  box-shadow: 0 0 18px rgba(167, 139, 250, 0.12);
}
.msg.ai .bubble {
  background: rgba(103, 232, 249, 0.09);
  border: 1px solid rgba(103, 232, 249, 0.32);
  border-bottom-left-radius: 6px;
  color: #e0f7ff;
  box-shadow: 0 0 18px rgba(103, 232, 249, 0.08);
}
.bubble .bubble-hint { color: var(--muted); font-size: 13px; }
/* MathJax 渲染的化学方程式:过长可横向滚动,颜色继承气泡 */
.bubble mjx-container { overflow-x: auto; overflow-y: hidden; max-width: 100%; color: inherit; }
.bubble mjx-container[display="true"] { margin: 10px 0; }
.bubble ul { padding-left: 18px; margin: 6px 0; }
.bubble li { margin: 3px 0; }
.typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
.typing i {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--cyan);
  animation: typingBounce 1s ease-in-out infinite;
}
.typing i:nth-child(2) { animation-delay: 0.15s; }
.typing i:nth-child(3) { animation-delay: 0.3s; }
@keyframes typingBounce {
  0%, 100% { opacity: 0.3; transform: translateY(0); }
  50% { opacity: 1; transform: translateY(-4px); }
}

/* 对话内的新闻引用卡片 */
.cite-list { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.cite-card {
  display: block;
  text-decoration: none;
  padding: 12px 14px;
  border-radius: 12px;
  background: rgba(8, 18, 34, 0.6);
  border: 1px solid rgba(103, 232, 249, 0.22);
  transition: border-color 0.25s ease, box-shadow 0.25s ease;
}
.cite-card:hover { border-color: rgba(103, 232, 249, 0.5); box-shadow: 0 4px 16px rgba(103, 232, 249, 0.12); }
.cite-title { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.5; margin-bottom: 5px; }
.cite-meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.cite-meta .cite-src { color: var(--cyan); }

/* ================= 附属子面板槽 ================= */
.subdock {
  flex: 0 0 auto;
  border-radius: 16px;
  border: 1px solid rgba(125, 211, 252, 0.12);
  background: rgba(3, 8, 20, 0.4);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  max-width: 860px;
  width: 100%;
  margin: 0 auto;
}
.subdock-tabs { display: flex; gap: 6px; padding: 8px; }
.sub-tab {
  flex: 1;
  appearance: none;
  border: none;
  background: transparent;
  color: rgba(226, 246, 255, 0.55);
  border-radius: 10px;
  padding: 8px 4px;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s ease;
  white-space: nowrap;
}
.sub-tab:hover { color: #fff; }
.sub-tab.active { color: #fff; background: linear-gradient(135deg, rgba(103, 232, 249, 0.85), rgba(167, 139, 250, 0.85)); }
.sub-panel { padding: 6px 14px 14px; }
.sub-panel[hidden] { display: none; }

/* 分子结构卡片(对话内渲染) */
@keyframes molSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.mol-chat { display: flex; align-items: center; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
.mol-img-wrap {
  flex: 0 0 auto;
  width: 150px;
  height: 150px;
  border-radius: 14px;
  background: #f4f8fb; /* PubChem 结构图为黑线透明底,需浅色底才能看清 */
  border: 1px solid rgba(103, 232, 249, 0.35);
  box-shadow: 0 0 20px rgba(103, 232, 249, 0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.mol-img-wrap img { max-width: 92%; max-height: 92%; display: block; }
.mol-chat-props { min-width: 0; flex: 1; }
.mol-prop { display: flex; gap: 6px; font-size: 12px; margin-top: 3px; }
.mol-prop dt { color: var(--muted); flex: 0 0 auto; }
.mol-prop dd { color: #e0f2fe; font-weight: 600; word-break: break-all; margin: 0; }

/* 文献引用面板 */
.lit-item { padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(167, 139, 250, 0.2); background: rgba(8, 18, 34, 0.45); margin-bottom: 8px; }
.lit-item a { color: #e0f2fe; font-size: 13.5px; font-weight: 600; text-decoration: none; line-height: 1.5; }
.lit-item a:hover { color: var(--cyan); }
.lit-meta { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.sub-empty { font-size: 13px; color: var(--muted); padding: 10px 4px; }

/* 热点标签面板 */
.agent-tag-actions { margin-bottom: 10px; }

/* 附加文献栏(拖拽/点击手柄后显示) */
.attach-bar {
  flex: 0 0 auto;
  max-width: 860px;
  width: 100%;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.attach-bar[hidden] { display: none; }
.attach-label { font-size: 12px; color: var(--muted); }
.attach-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  max-width: 320px;
  padding: 6px 8px 6px 12px;
  border-radius: 999px;
  border: 1px solid rgba(103, 232, 249, 0.4);
  background: rgba(103, 232, 249, 0.1);
  font-size: 12px;
  color: #d8f6ff;
}
.attach-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attach-chip button {
  appearance: none;
  border: none;
  background: rgba(251, 113, 133, 0.18);
  color: var(--coral);
  width: 18px;
  height: 18px;
  border-radius: 50%;
  font-size: 11px;
  cursor: pointer;
  flex: 0 0 auto;
  line-height: 1;
}
.attach-chip button:hover { background: rgba(251, 113, 133, 0.4); color: #fff; }

/* 聊天区拖放高亮 */
.chat-scroll.drop-target { border-color: rgba(103, 232, 249, 0.6); box-shadow: 0 0 0 3px rgba(103, 232, 249, 0.15), 0 22px 70px rgba(0, 0, 0, 0.22); }

/* 卡片拖拽手柄(点击或拖拽附加给 Agent) */
.drag-handle {
  position: absolute;
  top: 10px;
  right: 48px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid rgba(103, 232, 249, 0.3);
  background: rgba(8, 18, 34, 0.6);
  color: rgba(103, 232, 249, 0.6);
  font-size: 14px;
  cursor: grab;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s ease;
  user-select: none;
}
.drag-handle:hover { color: #fff; border-color: var(--cyan); box-shadow: 0 0 12px rgba(103, 232, 249, 0.4); transform: scale(1.12); }
.drag-handle:active { cursor: grabbing; }

/* ================= 底部输入区 ================= */
.composer {
  flex: 0 0 auto;
  max-width: 860px;
  width: 100%;
  margin: 0 auto;
  display: flex;
  gap: 10px;
  align-items: flex-end;
  padding: 10px;
  border-radius: 16px;
  border: 1px solid rgba(167, 139, 250, 0.3);
  background: rgba(8, 18, 34, 0.6);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 0 24px rgba(167, 139, 250, 0.08);
}
#composerInput {
  flex: 1;
  min-width: 0;
  appearance: none;
  border: none;
  outline: none;
  background: transparent;
  color: var(--text);
  font-size: 14.5px;
  line-height: 1.6;
  padding: 8px 10px;
  resize: none;
  max-height: 120px;
  font-family: inherit;
}
#composerInput::placeholder { color: rgba(210, 232, 255, 0.35); }
#composerSend {
  appearance: none;
  border: none;
  border-radius: 12px;
  padding: 10px 22px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  color: #fff;
  background: linear-gradient(135deg, #a78bfa, #67e8f9);
  transition: box-shadow 0.25s ease;
  white-space: nowrap;
}
#composerSend:hover:not(:disabled) { box-shadow: 0 6px 18px rgba(167, 139, 250, 0.4); }
#composerSend:disabled { opacity: 0.6; cursor: wait; }

/* ================= 拖拽分割线 ================= */
.divider {
  flex: 0 0 auto;
  width: 8px;
  cursor: col-resize;
  display: none;
  position: relative;
  z-index: 20;
}
.divider::after {
  content: "";
  position: absolute;
  left: 3px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: rgba(103, 232, 249, 0.2);
  transition: background 0.2s ease;
}
.divider:hover::after, body.dragging .divider::after { background: rgba(103, 232, 249, 0.6); }
.workspace.news-open .divider { display: block; }
body.dragging { cursor: col-resize; user-select: none; }

/* ================= 新闻子面板(可停靠可关闭) ================= */
.news-panel {
  flex: 0 0 auto;
  width: 0;
  overflow: hidden;
  opacity: 0;
  transition: width 0.35s ease, opacity 0.3s ease;
  display: flex;
  flex-direction: column;
  border-left: 1px solid rgba(125, 211, 252, 0.14);
  background: rgba(3, 8, 20, 0.55);
  backdrop-filter: blur(16px) saturate(120%);
  -webkit-backdrop-filter: blur(16px) saturate(120%);
}
.workspace.news-open .news-panel { width: var(--news-w); opacity: 1; }
.news-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid rgba(125, 211, 252, 0.12);
  min-width: 300px;
}
.news-head h2 {
  font-size: 16px;
  font-weight: 800;
  background: linear-gradient(90deg, #7dd3fc, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  white-space: nowrap;
}
.news-close {
  appearance: none;
  border: 1px solid rgba(251, 113, 133, 0.35);
  background: rgba(251, 113, 133, 0.1);
  color: var(--coral);
  width: 30px;
  height: 30px;
  border-radius: 9px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
  flex: 0 0 auto;
}
.news-close:hover { background: rgba(251, 113, 133, 0.25); color: #fff; }
.news-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 14px 16px 40px;
  min-width: 300px;
}
.backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(1, 2, 8, 0.55);
  z-index: 40;
}

/* 选中文本快捷解读按钮 */
.sel-pop {
  position: fixed;
  z-index: 90;
  appearance: none;
  border: 1px solid rgba(167, 139, 250, 0.5);
  background: rgba(24, 16, 48, 0.92);
  color: #ddd6fe;
  border-radius: 10px;
  padding: 7px 14px;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 16px rgba(167, 139, 250, 0.25);
  transition: transform 0.15s ease;
}
.sel-pop:hover { color: #fff; background: linear-gradient(135deg, #a78bfa, #67e8f9); }
.sel-pop[hidden] { display: none; }

/* ================= 新闻面板内部组件(迁移自原版) ================= */
.stats-bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 14px;
  padding: 10px 14px;
  margin-bottom: 14px;
  border-radius: 12px;
  background: rgba(4, 10, 22, 0.6);
  border: 1px solid rgba(167, 139, 250, 0.18);
  font-size: 12.5px;
  color: var(--muted);
}
.stats-bar .st-date { letter-spacing: 0.06em; font-weight: 600; }
.stats-bar .st-num { color: var(--cyan); font-weight: 800; }
.stats-bar .st-num.important { color: var(--coral); }
.stats-bar .st-cat { display: inline-flex; align-items: center; gap: 6px; }
.stats-bar .st-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
.st-dot.award { background: #f59e0b; }
.st-dot.product { background: #22c55e; }
.st-dot.company { background: #3b82f6; }
.st-dot.research { background: #8b5cf6; }
.stats-bar .st-source { width: 100%; font-size: 11px; color: rgba(210, 232, 255, 0.35); }

.filters {
  display: flex;
  gap: 6px;
  padding: 8px;
  margin-bottom: 12px;
  border-radius: 12px;
  background: rgba(3, 10, 22, 0.5);
  border: 1px solid rgba(103, 232, 249, 0.1);
}
.filter-btn {
  flex: 1;
  appearance: none;
  border: none;
  background: transparent;
  color: rgba(226, 246, 255, 0.6);
  border-radius: 9px;
  padding: 9px 4px;
  font-size: 12.5px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.3s ease;
  white-space: nowrap;
}
.filter-btn:hover { color: #fff; }
.filter-btn.active {
  color: #fff;
  background: linear-gradient(135deg, #67e8f9, #a78bfa);
  box-shadow: 0 6px 18px rgba(103, 232, 249, 0.25);
}

.search-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
#aiSearchInput {
  flex: 1;
  min-width: 140px;
  appearance: none;
  border: 1px solid rgba(167, 139, 250, 0.3);
  background: rgba(8, 18, 34, 0.55);
  color: var(--text);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13px;
  outline: none;
  transition: border-color 0.25s ease, box-shadow 0.25s ease;
}
#aiSearchInput::placeholder { color: rgba(210, 232, 255, 0.35); }
#aiSearchInput:focus { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.15); }
.search-btn {
  appearance: none;
  border: none;
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  color: #fff;
  background: linear-gradient(135deg, #a78bfa, #67e8f9);
  transition: box-shadow 0.25s ease;
  white-space: nowrap;
}
.search-btn:hover:not(:disabled) { box-shadow: 0 6px 18px rgba(167, 139, 250, 0.4); }
.search-btn:disabled { opacity: 0.6; cursor: wait; }
.search-clear-btn {
  appearance: none;
  border: 1px solid rgba(251, 113, 133, 0.4);
  background: rgba(251, 113, 133, 0.12);
  color: var(--coral);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
.search-clear-btn:hover { background: rgba(251, 113, 133, 0.22); }

/* 排行榜 */
.ranking-section { margin-bottom: 18px; }
.ranking-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.ranking-header h3 {
  font-size: 15px;
  font-weight: 700;
  background: linear-gradient(90deg, #fb7185, #fbbf24);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.ranking-hint { font-size: 11px; color: rgba(210, 232, 255, 0.4); }
.ranking-carousel { height: 264px; overflow: hidden; position: relative; }
.ranking-inner { transition: transform 0.6s cubic-bezier(0.25, 0.1, 0.25, 1); }
.ranking-loading { color: rgba(210, 232, 255, 0.4); font-size: 13px; text-align: center; padding: 24px; }
.ranking-card {
  height: 88px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  gap: 10px;

<script>
/* =========================================================

const CATEGORY_LABEL = { award: "奖项", product: "产品", company: "公司", research: "研究" };

// ===== DOM =====

const chatInner = $("chatInner"), chatScroll = $("chatScroll");

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function getVisitorId() {
  let id = localStorage.getItem("visitor_id");
  if (!id) {
    id = "v-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("visitor_id", id);
  }
  return id;
}

function getLocalFavorites() {
  try { return JSON.parse(localStorage.getItem("favorites") || "[]"); } catch { return []; }
}
function saveLocalFavorites(favs) { localStorage.setItem("favorites", JSON.stringify(favs)); }
function isFavorited(title) { return getLocalFavorites().some(f => f.title === title); }
function toggleFavorite(item) {
  const favs = getLocalFavorites();
  const idx = favs.findIndex(f => f.title === item.title);
  if (idx >= 0) {
    favs.splice(idx, 1);
    saveLocalFavorites(favs);
    fetch("/api/favorites", {
      method: "DELETE", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ visitor_id: VISITOR_ID, news_title: item.title }),
    }).then(() => loadRanking()).catch(() => {});
  } else {
    favs.push({ title: item.title, url: item.url, source: item.source, type: item.type, summary: item.summary });
    saveLocalFavorites(favs);
    fetch("/api/favorites", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        visitor_id: VISITOR_ID, news_title: item.title, news_url: item.url,
        news_source: item.source, news_type: item.type, news_summary: item.summary,
      }),
    }).then(() => loadRanking()).catch(() => {});
  }
  updateFavoriteButtons();
  renderStats();
  lastAIIndices = [];
  recommendVisible = false;
  aiGenBtn.textContent = "根据我的收藏生成推荐";
  aiDescEl.textContent = AI_DESC_DEFAULT;
  aiGridEl.innerHTML = "";
  renderNews(currentFilter === "favorites" ? "favorites" : currentFilter);
}

// 调用 /api/ai/chat,返回纯文本回复
async function callAgentChat(text) {
  const resp = await fetch("/api/ai/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      message: text,
      history: chatHistory.slice(-10),
      news: newsData.slice(0, 15).map(n => ({ title: n.title, summary: n.summary, type: n.type })),
      articles: attachedArticles.map(a => ({ title: a.title, url: a.url, summary: a.summary, source: a.source })),
    }),
  });
  const json = await resp.json();
  if (json.code === 200 && json.data) return json.data;
  throw new Error(json.message || "Agent 接口错误");
}

// AI 纯文本回复 → 气泡 HTML(转义 + 换行/列表简单排版)
function fmtReply(text) {
  return escapeHtml(text)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/\n/g, "<br>");
}

const attachedArticles = [];

function renderAttachBar() {
  if (attachedArticles.length === 0) {
    attachBar.hidden = true;
    attachBar.innerHTML = "";
    return;
  }
  attachBar.hidden = false;
  attachBar.innerHTML = '<span class="attach-label">📎 附加给 Agent:</span>' + attachedArticles.map((a, i) =>
    `<span class="attach-chip"><span title="${escapeHtml(a.title)}">《${escapeHtml(displayName(a))}》</span><button data-rm="${i}" title="移除">✕</button></span>`).join("");
}
attachBar.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-rm]");
  if (!btn) return;
  attachedArticles.splice(parseInt(btn.dataset.rm), 1);
  renderAttachBar();
});
function attachArticle(item) {
  if (!item) return;
  if (attachedArticles.some(a => a.title === item.title)) return; // 去重
  if (attachedArticles.length >= 3) attachedArticles.shift(); // 最多 3 篇
  attachedArticles.push({ title: item.title, url: item.url || "", summary: item.summary || "", source: item.source || "" });
  renderAttachBar();
  addMessage("ai", `已把文献<b>《${escapeHtml(displayName(item))}》</b>附加到对话 📎,我会阅读它的网页内容后回答你的相关问题。可同时附加多篇(最多 3 篇),点芯片上的 ✕ 移除。`);
}

let agentBusy = false;
async function handleUserText(text) {
  if (agentBusy || !text) return;
  agentBusy = true;
  composerSend.disabled = true;
  // 用户气泡:问题 + 附加的文献卡片
  const attachHtml = attachedArticles.length > 0
    ? '<div class="cite-list">' + attachedArticles.map(a =>
        `<a class="cite-card" href="${a.url || "#"}" target="_blank" rel="noopener noreferrer"><div class="cite-title">📎 ${escapeHtml(a.title)}</div><div class="cite-meta"><span class="cite-src">${escapeHtml(a.source || "")}</span></div></a>`
      ).join("") + "</div>"
    : "";
  addMessage("user", escapeHtml(text) + attachHtml);
  const typingEl = addTyping();

  // 意图:分子结构查询 → 对话内直接渲染结构卡片
  const molQuery = parseMoleculeQuery(text);
  if (molQuery) {
    const result = await fetchMolecule(molQuery);
    typingEl.remove();
    addMessage("ai", moleculeCardHtml(result));
    agentBusy = false;
    composerSend.disabled = false;
    return;
  }

  // 指令:唤起新闻文献
  if (/^\/?news/i.test(text) || text.includes("新闻") || text.includes("文献")) {
    openNewsPanel();
    await new Promise(r => setTimeout(r, 500));
    typingEl.remove();
    if (newsData.length > 0) {
      addMessage("ai", `已为你唤起新闻文献面板 📰,以下是今日 Top 3 化学资讯:` + citationCardsHtml(newsData.slice(0, 3)));
    } else {
      addMessage("ai", `已为你唤起新闻文献面板 📰,新闻数据加载后可在此查看引用卡片。`);
    }
  } else {
    let replyHtml = null;
    let replyText = "";
    if (typeof window.AGENT_BACKEND_HOOK === "function") {
      // 自定义后端钩子(返回 HTML)
      try { replyHtml = await window.AGENT_BACKEND_HOOK(text, { newsData, chatHistory }); } catch (e) { console.log("Agent 后端调用失败", e); }
    } else {
      // 默认:DeepSeek 化学智能体
      try {
        replyText = await callAgentChat(text);
        replyHtml = fmtReply(replyText);
        // Agent 回复中的 [MOL]…[/MOL] 标记 → 渲染分子结构卡片
        const molMarker = replyText.match(/\[MOL\](.+?)\[\/MOL\]/i);
        if (molMarker) {
          replyHtml = fmtReply(replyText.replace(molMarker[0], "").trim());
          const molResult = await fetchMolecule(molMarker[1].trim());
          replyHtml += moleculeCardHtml(molResult);
          replyText = replyText.replace(molMarker[0], "").trim(); // 历史中不保留标记
        }
      } catch (e) {
        console.log("Agent 对话失败", e);
        replyHtml = `⚠️ 智能体暂时无法应答(${escapeHtml(e.message || "网络错误")}),请稍后再试。`;
      }
    }
    typingEl.remove();
    addMessage("ai", replyHtml);
    // 成功的真实回复写入对话历史(注明附件,供后续追问理解上下文)
    if (replyText) {
      const historyText = attachedArticles.length > 0
        ? text + "\n[附加文献:" + attachedArticles.map(a => "《" + a.title + "》").join("") + "]"
        : text;
      chatHistory.push({ role: "user", content: historyText }, { role: "assistant", content: replyText });
      if (chatHistory.length > 20) chatHistory.splice(0, chatHistory.length - 20);
    }
  }
  agentBusy = false;
  composerSend.disabled = false;
}

// ===== 分子结构查询(PubChem PUG REST,免费无密钥;中文名经 DeepSeek 转换) =====
const PUBCHEM = "https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound";

// 根据输入形态决定查询方式优先级:纯分子式 → fastformula;含 SMILES 特征字符 → smiles;其余按名称(三种方式依次尝试,保证命中)
function molQueryKinds(q) {
  if (/^([A-Z][a-z]?\d*)+$/.test(q)) return ["fastformula", "name", "smiles"];
  if (/[()=#\[\]@\\\/+]/.test(q)) return ["smiles", "name", "fastformula"];
  return ["name", "smiles", "fastformula"];
}

// 查询分子结构,返回 { imgUrl, prop, note, query } 或 { error }
async function fetchMolecule(query) {
  query = (query || "").trim();
  if (!query) return { error: "请输入化合物名称" };
  let note = "";
  // 中文名:先用 DeepSeek 转成英文名 + SMILES,再查 PubChem
  if (/[一-龥]/.test(query)) {
    try {
      const resp = await fetch("/api/ai/compound", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: query }),
      });
      const json = await resp.json();
      if (json.code === 200 && json.data && (json.data.smiles || json.data.english)) {
        note = `已自动翻译:「${escapeHtml(query)}」→ <b>${escapeHtml(json.data.english || json.data.smiles)}</b><br>`;
        query = json.data.smiles || json.data.english; // SMILES 查询最精确
      } else {
        return { error: `无法识别「${query}」,请换用更规范的名称,或直接输入英文名 / 分子式 / SMILES。` };
      }
    } catch {
      return { error: "翻译服务暂不可用,请改用英文名 / 分子式 / SMILES 直接查询。" };
    }
  }
  for (const kind of molQueryKinds(query)) {
    try {
      const resp = await fetch(`${PUBCHEM}/${kind}/${encodeURIComponent(query)}/property/MolecularFormula,MolecularWeight,IUPACName,IsomericSMILES/JSON`);
      if (!resp.ok) continue;
      const json = await resp.json();
      const prop = json.PropertyTable && json.PropertyTable.Properties && json.PropertyTable.Properties[0];
      if (prop) {
        return {
          imgUrl: `${PUBCHEM}/${kind}/${encodeURIComponent(query)}/PNG`,
          prop, note, query,
        };
      }
    } catch {}
  }
  return { error: `PubChem 未找到「${query}」,请尝试英文通用名、标准分子式或合法 SMILES。` };
}

// 对话内分子结构卡片
function moleculeCardHtml(r) {
  if (r.error) return `⚠️ ${escapeHtml(r.error)}`;
  const p = r.prop;
  return `
    ${r.note}🧬 <b>${escapeHtml(p.IUPACName || r.query)}</b>
    <div class="mol-chat">
      <span class="mol-img-wrap"><img src="${r.imgUrl}" alt="${escapeHtml(r.query)} 结构式"></span>
      <dl class="mol-chat-props">
        <div class="mol-prop"><dt>分子式</dt><dd>${escapeHtml(p.MolecularFormula || "-")}</dd></div>
        <div class="mol-prop"><dt>分子量</dt><dd>${escapeHtml(String(p.MolecularWeight || "-"))} g/mol</dd></div>
        <div class="mol-prop"><dt>SMILES</dt><dd>${escapeHtml(p.IsomericSMILES || "-")}</dd></div>
      </dl>
    </div>
    <span class="bubble-hint">数据源:PubChem CID ${p.CID} · 想进一步了解它的性质?直接继续问我。</span>`;
}

// 从用户消息中识别分子结构查询意图:/mol X、/分子 X、「X的结构式」「生成X的分子式图像」等
function parseMoleculeQuery(text) {
  let m = text.match(/^\/(?:mol|分子)\s*[:：]?\s*(.+)$/i);
  if (m) return m[1].trim();
  m = text.match(/^(?:帮我|给我|我想看?|我想看看|请)?(?:画|生成|画出|显示|看看|查|做)?一?[下张个幅]?(.{1,24}?)(?:的)?(?:分子)?(?:结构式|结构图|结构|分子式|分子模型)(?:图|图像|可视化|的可视化图像)?[。!！？?]*$/);
  if (m) {
    const q = m[1].trim();
    // 排除代词/疑问词开头与"分子式"本身被当成化合物名的情况
    if (q && !/^(我|你|它|这|那|哪|什么|怎么|为什么)/.test(q) && !/^(分子式|结构式|结构图|分子|化合物)$/.test(q)) return q;
  }
  return null;
}

divider.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  const startX = e.clientX;
  const startW = newsPanel.getBoundingClientRect().width;
  function onMove(ev) {
    const w = Math.min(Math.max(startW + (startX - ev.clientX), 320), workspace.clientWidth * 0.72);
    workspace.style.setProperty("--news-w", Math.round(w) + "px");
  }
  function onUp() {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    document.body.classList.remove("dragging");
  }
  document.body.classList.add("dragging");
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
});

   ========================================================= */
function hideSelPop() { selPop.hidden = true; }
document.addEventListener("mouseup", (e) => {
  setTimeout(() => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) { if (!selPop.contains(e.target)) hideSelPop(); return; }
    const text = sel.toString().trim();
    // 仅新闻面板内的选中生效
    if (!text || !newsPanel.contains(sel.anchorNode)) { hideSelPop(); return; }
    const rect = sel.getRangeAt(0).getBoundingClientRect();
    selPop.style.left = Math.min(rect.left + rect.width / 2 - 70, window.innerWidth - 170) + "px";
    selPop.style.top = Math.max(rect.top - 44, 8) + "px";
    selPop.hidden = false;
  }, 10);
});
document.addEventListener("mousedown", (e) => {
  if (!selPop.contains(e.target)) hideSelPop();
});
selPop.addEventListener("click", async () => {
  const text = window.getSelection().toString().trim();
  hideSelPop();
  if (!text) return;
  window.getSelection().removeAllRanges();
  const clipped = text.length > 300 ? text.slice(0, 300) + "…" : text;
  addUserMessage("请解读以下内容:「" + clipped + "」");
  const typingEl = addTyping();
  // 优先复用已有 DeepSeek 解读接口;失败时回退到演示回复
  let replied = false;
  try {
    const resp = await fetch("/api/ai/explain", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: clipped, summary: "" }),
    });
    const json = await resp.json();
    if (json.code === 200 && json.data) {
      typingEl.remove();
      addMessage("ai", "🔍 <b>选中内容解读:</b><br>" + escapeHtml(json.data));
      replied = true;
    }
  } catch (e) { console.log("解读失败", e); }
  if (!replied) {
    typingEl.remove();
    addMessage("ai", stubReply("解读:「" + clipped.slice(0, 40) + "…」"));
  }
});

const API_V1 = "/api/v1/news";
async function loadNewsData() {
  try {
    const resp = await fetch(API_V1);
    if (resp.ok) {
      const json = await resp.json();
      if (json.code === 200 && json.news && json.news.length > 0) {
        newsData = json.news.map(n => ({ ...n, type: n.category.key }));
        const catLabels = {};
        Object.keys(json.categories).forEach(k => { catLabels[k] = json.categories[k].label; });
        categoryLabels = catLabels;
        return;
      }
    }
  } catch (e) {}
  newsData = [];
}

function formatToday() {
  const now = new Date();
  const week = ["日", "一", "二", "三", "四", "五", "六"][now.getDay()];
  return `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 · 星期${week}`;
}

function renderStats() {
  const existingTitles = new Set(newsData.map(n => n.title));
  const extraFavs = getLocalFavorites().filter(f => !existingTitles.has(f.title));
  const allItems = [...newsData, ...extraFavs];
  const total = allItems.length;
  const importantCount = allItems.filter(item => item.important).length;
  const counts = { award: 0, product: 0, company: 0, research: 0 };
  allItems.forEach(item => { if (counts[item.type] !== undefined) counts[item.type]++; });
  heroStatsEl.innerHTML = `
    <span class="st-date">${formatToday()}</span>

// 版面按重要性动态分配:important 的新闻使用大标题样式
function newsTemplate(item, index) {
  const featured = !!item.important;
  const tagHtml = `<span class="story-tag ${item.type}">${categoryLabels[item.type] || item.type}</span>`;
  const importantHtml = featured ? `<span class="story-important">重要</span>` : "";
  const decoHtml = featured ? BENZENE_SVG : "";
  const title = displayName(item);
  const isTranslated = translatedState.has(item.title) && translationCache[item.title] && isEnglishTitle(item.title);
  const titleAttr = isTranslated ? ` title="原文: ${escapeHtml(item.title)}"` : "";
  return `
    <article class="story ${featured ? "story-featured" : ""}" data-type="${item.type}">
      ${decoHtml}${favBtnHtml(item, index)}
      <span class="drag-handle" draggable="true" data-dragidx="${index}" title="点击或拖拽到对话区,把本文附加给 Agent">⠿</span>

}

function renderNews(filter = "all") {
  currentFilter = filter;
  let list;
  if (searchIndices !== null) {
    list = searchIndices.map(i => newsData[i]).filter(Boolean);
  } else if (filter === "favorites") {
    list = getLocalFavorites().map(f => ({ ...f, time: "★", important: false }));
  } else if (activeFilters.size > 0) {
    list = newsData.filter(item => activeFilters.has(item.type));
    const existingTitles = new Set(list.map(n => n.title));
    getLocalFavorites().forEach(f => {
      if (!existingTitles.has(f.title) && activeFilters.has(f.type)) list.push({ ...f, time: "★", important: false });
    });
  } else {
    list = [...newsData];
    const existingTitles = new Set(list.map(n => n.title));
    getLocalFavorites().forEach(f => {
      if (!existingTitles.has(f.title)) list.push({ ...f, time: "★", important: false });
    });
  }
  newsIndexMap = {};
  list.forEach((item, i) => { newsIndexMap[i] = item; });
  masonryEl.innerHTML = list.map((item, i) => newsTemplate(item, i)).join("");
  emptyEl.style.display = (filter !== "favorites" && list.length === 0) ? "block" : "none";
  favEmptyEl.style.display = (filter === "favorites" && list.length === 0) ? "block" : "none";
}

async function handleTranslateClick(e) {
  const btn = e.target.closest(".translate-btn");
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  const title = decodeURIComponent(btn.dataset.title);
  if (translatedState.has(title)) {
    translatedState.delete(title);
    refreshAll();
    return;
  }
  if (translationCache[title]) {
    translatedState.add(title);
    refreshAll();
    return;
  }
  btn.textContent = "…";
  btn.disabled = true;
  try {
    const resp = await fetch("/api/ai/translate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ titles: [title] }),
    });
    if (resp.ok) {
      const json = await resp.json();
      if (json.code === 200 && json.data && json.data[title]) {
        translationCache[title] = json.data[title];
        saveTranslationCache();
        translatedState.add(title);
      }
    }
  } catch (err) { console.log("翻译失败", err); }
  refreshAll();
}

// ===== 排行榜 =====
let rankingTimer = null;
let rankingPos = 0;
async function loadRanking() {
  try {
    const resp = await fetch("/api/ranking");
    let rankedItems = [];
    if (resp.ok) rankedItems = (await resp.json()).data || [];
    const rankedTitles = new Set(rankedItems.map(i => i.news_title));
    const unrankedNews = newsData
      .filter(n => !rankedTitles.has(n.title))
      .map(n => ({ news_title: n.title, news_url: n.url || "", news_source: n.source || "", news_type: n.type || "", favorite_count: 0 }));
    const allItems = [...rankedItems, ...unrankedNews].slice(0, 10);
    if (allItems.length === 0) {
      rankingCarouselEl.innerHTML = '<div class="ranking-loading">暂无新闻数据</div>';
      return;
    }
    rankingCarouselEl.innerHTML = `<div class="ranking-inner" id="rankingInner">` + allItems.map((item, i) => {
      const rank = i + 1;
      const isTop3 = rank <= 3;
      const rankItem = { title: item.news_title };
      const medal = rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : `${rank}`;
      return `
        <div class="ranking-card ${isTop3 ? "top3" : ""}">
          <div class="ranking-rank">${medal}</div>
          <div class="ranking-body">
            ${isTop3 ? '<span class="flame-icon"></span>' : ""}
            <a class="ranking-title ${isTop3 ? "top" + rank : ""}" href="${item.news_url || "#"}" target="_blank" rel="noopener">${escapeHtml(displayName(rankItem))}</a>
            <div class="ranking-meta">
              <span class="ranking-source">${escapeHtml(item.news_source || "")}</span>
              <span class="ranking-count">♡ ${item.favorite_count}</span>
              ${translateBtnHtml(rankItem)}
            </div>
          </div>
        </div>`;
    }).join("") + `</div>`;
    const innerEl = $("rankingInner");
    if (rankingTimer) clearInterval(rankingTimer);
    rankingPos = 0;
    if (innerEl) innerEl.style.transform = "translateY(0)";
    if (allItems.length > 3 && innerEl) {
      rankingTimer = setInterval(() => {
        rankingPos++;
        if (rankingPos > allItems.length - 3) rankingPos = 0;
        innerEl.style.transform = `translateY(-${rankingPos * 88}px)`;
      }, 3000);
    }
  } catch (e) {
    rankingCarouselEl.innerHTML = '<div class="ranking-loading">排行榜加载失败</div>';
  }
}

async function runAISearch(query) {
  query = (query || "").trim();
  if (!query || newsData.length === 0) return;
  aiSearchBtn.disabled = true;
  aiSearchBtn.textContent = "搜索中…";
  try {
    const resp = await fetch("/api/ai/search", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, news: newsData.map(n => ({ title: n.title, summary: n.summary, type: n.type })) }),
    });
    const json = await resp.json();
    if (json.code === 200) {
      searchIndices = json.data || [];
      searchQueryText = query;
      activeFilters.clear();
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      document.querySelector('[data-filter="all"]').classList.add("active");
      aiSearchClear.style.display = "inline-block";
      renderNews("all");
      if (searchIndices.length === 0) {
        emptyEl.textContent = `没有找到与「${query}」相关的新闻。`;
        emptyEl.style.display = "block";
      } else {
        emptyEl.textContent = "当前分类暂无新闻。";
      }
    }
  } catch (err) { console.log("搜索失败", err); }
  aiSearchBtn.disabled = false;
  aiSearchBtn.textContent = "搜索";
}
function clearAISearch() {
  searchIndices = null;
  searchQueryText = "";
  aiSearchInput.value = "";
  aiSearchClear.style.display = "none";
  emptyEl.textContent = "当前分类暂无新闻。";
  renderNews("all");
}

function renderTagCloud(activeTag) {
  aiTagCloud.innerHTML = currentTags.map((t, i) =>
    `<button class="tag-chip ${activeTag === t.tag ? "active" : ""}" data-tagidx="${i}">${escapeHtml(t.tag)}<span class="tag-count">${t.indices.length}</span></button>`).join("");
}
aiTagCloud.addEventListener("click", (e) => {
  const chip = e.target.closest(".tag-chip");
  if (!chip) return;
  const tag = currentTags[parseInt(chip.dataset.tagidx)];
  if (!tag) return;
  if (searchIndices !== null && searchQueryText === "tag:" + tag.tag) {
    clearAISearch();
    renderTagCloud();
    return;
  }
  searchIndices = tag.indices;
  searchQueryText = "tag:" + tag.tag;
  activeFilters.clear();
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  document.querySelector('[data-filter="all"]').classList.add("active");
  aiSearchClear.style.display = "inline-block";
  renderTagCloud(tag.tag);
  renderNews("all");
});

// ===== AI 智能推荐 =====
let lastAIIndices = [];
let recommendVisible = false;
let recommendDesc = "";
const AI_DESC_DEFAULT = aiDescEl.textContent;
async function generateAIRecommend() {
  if (recommendVisible) {
    aiGridEl.innerHTML = "";
    recommendVisible = false;
    aiGenBtn.textContent = "根据我的收藏生成推荐";
    aiDescEl.textContent = AI_DESC_DEFAULT;
    return;
  }
  if (lastAIIndices.length > 0) {
    renderAIRecommend(lastAIIndices);
    aiDescEl.textContent = recommendDesc;
    recommendVisible = true;
    aiGenBtn.textContent = "收起推荐";
    return;
  }
  if (newsData.length === 0) {
    aiGridEl.innerHTML = '<div class="ai-empty">暂无新闻数据</div>';
    return;
  }
  const favTitles = getLocalFavorites().map(f => f.title);
  aiGenBtn.disabled = true;
  aiGenBtn.textContent = "AI 分析中…";
  aiGridEl.innerHTML = '<div class="ai-loading">DeepSeek 正在分析你的偏好…</div>';
  try {
    const resp = await fetch("/api/ai/recommend", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ favorites: favTitles, news: newsData.map(n => ({ title: n.title, summary: n.summary, type: n.type })) }),
    });
    const json = await resp.json();
    if (json.code === 200 && json.data && json.data.length > 0) {
      lastAIIndices = json.data;
      renderAIRecommend(json.data);
      recommendDesc = favTitles.length > 0
        ? `基于你收藏的 ${favTitles.length} 条新闻生成,共推荐 ${json.data.length} 条。`
        : `你还没有收藏,这是 AI 根据新闻重要性挑选的 ${json.data.length} 条。`;
      aiDescEl.textContent = recommendDesc;
      recommendVisible = true;
      aiGenBtn.textContent = "收起推荐";
    } else {
      aiGridEl.innerHTML = '<div class="ai-empty">未能生成推荐,请稍后再试。</div>';
      aiGenBtn.textContent = "根据我的收藏生成推荐";
    }
  } catch (e) {
    aiGridEl.innerHTML = '<div class="ai-empty">推荐生成失败,请稍后再试。</div>';
    aiGenBtn.textContent = "根据我的收藏生成推荐";
  }
  aiGenBtn.disabled = false;
}
function renderAIRecommend(indices) {
  const items = indices.map(i => newsData[i]).filter(Boolean);
  if (items.length === 0) {
    aiGridEl.innerHTML = '<div class="ai-empty">暂无推荐结果</div>';
    return;
  }
  aiGridEl.innerHTML = items.map((item, i) => `
    <article class="ai-card">
      <div class="ai-card-rank">#${i + 1}</div>
      <div class="ai-card-body">
        <div class="story-meta-line"><span class="story-time">${escapeHtml(item.time || "")}</span><span class="story-tag ${item.type}">${categoryLabels[item.type] || item.type}</span></div>
        <h4 class="ai-card-title">${escapeHtml(displayName(item))}${translateBtnHtml(item)}</h4>
        <p class="ai-card-summary">${escapeHtml(item.summary || "")}</p>
        <div class="story-foot"><span class="story-source">${escapeHtml(item.source || "")}</span><a class="story-link" href="${item.url}" target="_blank" rel="noopener noreferrer">阅读全文 ↗</a></div>
      </div>
    </article>`).join("");
}
aiGenBtn.addEventListener("click", generateAIRecommend);

const aiPanels = { brief: $("aiPanelBrief"), tags: $("aiPanelTags"), recommend: $("aiPanelRecommend") };
document.querySelectorAll(".ai-tab").forEach(tab => {

/* =========================================================
   Three.js 深空背景:星空 + 水面波纹鼠标效果
   ========================================================= */
(function initSpaceBackground() {
  if (!window.THREE) return;
  const canvas = $("bg-canvas");
  const compact = window.matchMedia("(max-width: 760px)").matches;
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: !compact, powerPreference: "high-performance" });
  renderer.setClearColor(0x000000, 0);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, compact ? 1.25 : 1.65));
  renderer.outputEncoding = THREE.sRGBEncoding;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 180);
  camera.position.set(0, 2.5, 27);
  camera.lookAt(0, 1.5, -8);
  const clock = new THREE.Clock();

  // 星空
  const starCount = compact ? 280 : 620;
  const positions = new Float32Array(starCount * 3);
  const colors = new Float32Array(starCount * 3);
  const palette = [new THREE.Color(0x62d9ff), new THREE.Color(0xa8f4ff), new THREE.Color(0xb39aff), new THREE.Color(0xf2d58b)];
  for (let i = 0; i < starCount; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 120;
    positions[i * 3 + 1] = (Math.random() - 0.5) * 70;
    positions[i * 3 + 2] = -Math.random() * 90 + 10;
    const c = palette[Math.floor(Math.random() * palette.length)];
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  starGeo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 0.16, vertexColors: true, transparent: true, opacity: 0.85, depthWrite: false }));
  scene.add(stars);

  // 漂浮的化学分子(球棍模型:发光原子 + 键线,缓慢旋转与上下浮动)
  const molecules = [];
  const molPalette = [0x62d9ff, 0xa78bfa, 0xf2d58b];
  const atomGeo = new THREE.SphereGeometry(0.09, 8, 8);
  function makeMolecule() {
    const group = new THREE.Group();
    const atomCount = 3 + Math.floor(Math.random() * 4); // 3~6 个原子
    const points = [];
    for (let i = 0; i < atomCount; i++) {
      const angle = (i / atomCount) * Math.PI * 2;
      const p = new THREE.Vector3(Math.cos(angle) * 0.42, Math.sin(angle) * 0.42, (Math.random() - 0.5) * 0.35);
      points.push(p);
      const atom = new THREE.Mesh(atomGeo, new THREE.MeshBasicMaterial({
        color: molPalette[i % molPalette.length],
        transparent: true, opacity: 0.55,
        blending: THREE.AdditiveBlending, depthWrite: false,
      }));
      atom.position.copy(p);
      group.add(atom);
    }
    const bondGeo = new THREE.BufferGeometry().setFromPoints([...points, points[0]]);
    group.add(new THREE.Line(bondGeo, new THREE.LineBasicMaterial({
      color: 0x67e8f9, transparent: true, opacity: 0.3,
      blending: THREE.AdditiveBlending, depthWrite: false,
    })));
    return group;
  }
  const molCount = compact ? 8 : 14;
  for (let i = 0; i < molCount; i++) {
    const m = makeMolecule();
    m.position.set((Math.random() - 0.5) * 46, (Math.random() - 0.5) * 26, -6 - Math.random() * 22);
    const s = 0.8 + Math.random() * 1.6;
    m.scale.setScalar(s);
    m.userData = {
      rotSpeed: (Math.random() - 0.5) * 0.5,
      bobSpeed: 0.25 + Math.random() * 0.5,
      phase: Math.random() * Math.PI * 2,
      baseY: m.position.y,
    };
    scene.add(m);
    molecules.push(m);
  }

  function resize() {
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.fov = window.innerWidth < 620 ? 57 : 50;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize, { passive: true });
  resize();

  (function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.05);
    const time = clock.elapsedTime;
    stars.rotation.y = time * 0.0018;
    molecules.forEach(m => {
      const d = m.userData;
      m.rotation.z += delta * d.rotSpeed;
      m.rotation.y += delta * d.rotSpeed * 0.6;
      m.position.y = d.baseY + Math.sin(time * d.bobSpeed + d.phase) * 0.7;
    });
    renderer.render(scene, camera);
  })();
})();

/* =========================================================
   鼠标水面波纹特效(顶层 2D 画布,浮于面板之上,不拦截交互)
   ========================================================= */
(function initRippleFX() {
  const canvas = $("fx-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize, { passive: true });
  resize();

  const ripples = [];
  let lastX = 0, lastY = 0, lastAt = 0;
  window.addEventListener("pointermove", (e) => {
    const now = performance.now();
    const dist = Math.hypot(e.clientX - lastX, e.clientY - lastY);
    if (dist < 14 || now - lastAt < 40) return;
    lastX = e.clientX; lastY = e.clientY; lastAt = now;
    ripples.push({
      x: e.clientX, y: e.clientY,
      age: 0,
      life: reducedMotion ? 0.5 : 1.1,
      maxR: 34 + Math.min(dist * 0.9, 46),
      brightness: Math.min(1, 0.7 + dist * 0.02),
    });
    if (ripples.length > 40) ripples.shift();
  }, { passive: true });

  let prev = performance.now();
  (function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - prev) / 1000, 0.05);
    prev = now;
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.age += dt;
      const p = r.age / r.life;
      if (p >= 1) { ripples.splice(i, 1); continue; }
      const fade = 1 - p;
      const easeOut = 1 - Math.pow(fade, 2.2);
      const baseR = 6 + (r.maxR - 6) * easeOut;
      // 三道同心涟漪,边缘正弦抖动模拟水面震动
      [1, 0.62, 0.34].forEach((f, k) => {
        const rr = baseR * f;
        if (rr < 2) return;
        ctx.beginPath();
        const seg = 26;
        for (let s = 0; s <= seg; s++) {
          const a = (s / seg) * Math.PI * 2;
          const wobble = Math.sin(a * 7 + p * 18) * 2.2;
          const px = r.x + Math.cos(a) * (rr + wobble);
          const py = r.y + Math.sin(a) * (rr + wobble);
          s === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath();
        const alpha = Math.pow(fade, 1.25) * r.brightness * (k === 0 ? 0.85 : k === 1 ? 0.5 : 0.3);
        ctx.strokeStyle = k === 0 ? `rgba(103,232,249,${alpha})` : `rgba(167,139,250,${alpha})`;
        ctx.lineWidth = k === 0 ? 2.2 : 1.4;
        ctx.stroke();
      });
    }
  })(prev);
})();
