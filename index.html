<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>化学智能体工作台 · Chemistry Agent</title>
<script>
// MathJax 配置:加载 mhchem 扩展以支持 \ce{} 化学方程式
window.MathJax = {
  loader: { load: ['[tex]/mhchem'] },
  tex: {
    packages: { '[+]': ['mhchem'] },
    inlineMath: [['\\(', '\\)']],
    displayMath: [['\\[', '\\]']],
  },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
<style>
/* ================= 全局变量与基础 ================= */
:root {
  --text: #eef7ff;
  --muted: rgba(210, 232, 255, 0.66);
  --cyan: #67e8f9;
  --violet: #a78bfa;
  --coral: #fb7185;
  --card-bg: rgba(8, 18, 34, 0.55);
  --card-border: rgba(125, 211, 252, 0.18);
  --news-w: 460px; /* 新闻面板宽度(可拖拽调整) */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; scroll-behavior: smooth; background: #02030a; }
body {
  height: 100vh;
  overflow: hidden;
  isolation: isolate;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: transparent;
  user-select: text;
}
/* 深空底色 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(circle at 16% 8%, rgba(16, 83, 150, 0.25), transparent 38%),
    radial-gradient(circle at 82% 19%, rgba(70, 38, 119, 0.22), transparent 42%),
    radial-gradient(circle at 52% 88%, rgba(8, 56, 94, 0.18), transparent 46%),
    linear-gradient(155deg, rgba(6, 16, 31, 0.48) 0%, rgba(7, 8, 23, 0.56) 44%, rgba(1, 2, 8, 0.64) 100%);
}
#bg-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -2;
  pointer-events: none;
  opacity: 0.86;
}
/* 鼠标波纹特效层:浮于所有面板之上,不拦截任何交互 */
#fx-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 60;
  pointer-events: none;
}

/* ================= 整体框架:顶栏 + 工作区 ================= */
.app { display: flex; flex-direction: column; height: 100vh; }
.topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 22px;
  border-bottom: 1px solid rgba(125, 211, 252, 0.14);
  background: rgba(3, 8, 20, 0.6);
  backdrop-filter: blur(14px) saturate(120%);
  -webkit-backdrop-filter: blur(14px) saturate(120%);
  z-index: 30;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.08em;
  background: linear-gradient(90deg, #cffafe, #7dd3fc, #a78bfa);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  white-space: nowrap;
}
.brand-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 10px rgba(103, 232, 249, 0.8);
  -webkit-text-fill-color: initial;
}
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.stats-chip {
  font-size: 12px;
  color: var(--muted);
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid rgba(103, 232, 249, 0.18);
  background: rgba(8, 18, 34, 0.5);
  white-space: nowrap;
}
.stats-chip b { color: var(--cyan); }
.news-toggle {
  appearance: none;
  border: 1px solid rgba(103, 232, 249, 0.4);
  background: rgba(103, 232, 249, 0.12);
  color: var(--cyan);
  border-radius: 12px;
  padding: 8px 18px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s ease;
  white-space: nowrap;
}
.news-toggle:hover { color: #fff; background: linear-gradient(135deg, #67e8f9, #a78bfa); border-color: transparent; box-shadow: 0 6px 18px rgba(103, 232, 249, 0.3); }
.news-toggle.open { color: #fff; background: linear-gradient(135deg, #67e8f9, #a78bfa); border-color: transparent; }

.workspace { flex: 1; display: flex; min-height: 0; position: relative; }

/* ================= Agent 工作台(页面默认主体) ================= */
.agent {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 20px clamp(16px, 4vw, 56px) 16px;
  gap: 14px;
}
.chat-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  border-radius: 18px;
  border: 1px solid rgba(125, 211, 252, 0.14);
  /* 高通透毛玻璃:让星空与漂浮分子透出来 */
  background: rgba(3, 8, 20, 0.22);
  backdrop-filter: blur(8px) saturate(125%);
  -webkit-backdrop-filter: blur(8px) saturate(125%);
  box-shadow: 0 22px 70px rgba(0, 0, 0, 0.22);
}
.chat-inner {
  max-width: 860px;
  margin: 0 auto;
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.msg { display: flex; }
.msg.user { justify-content: flex-end; }
.bubble {
  max-width: 78%;
  padding: 13px 17px;
  font-size: 14.5px;
  line-height: 1.8;
  border-radius: 16px;
  user-select: text;
  word-break: break-word;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.msg.user .bubble {
  background: rgba(167, 139, 250, 0.16);
  border: 1px solid rgba(167, 139, 250, 0.4);
  border-bottom-right-radius: 6px;
  color: #ede9fe;
  box-shadow: 0 0 18px rgba(167, 139, 250, 0.12);
}
.msg.ai .bubble {
  background: rgba(103, 232, 249, 0.09);
  border: 1px solid rgba(103, 232, 249, 0.32);
  border-bottom-left-radius: 6px;
  color: #e0f7ff;
  box-shadow: 0 0 18px rgba(103, 232, 249, 0.08);
}
.bubble .bubble-hint { color: var(--muted); font-size: 13px; }
/* MathJax 渲染的化学方程式:过长可横向滚动,颜色继承气泡 */
.bubble mjx-container { overflow-x: auto; overflow-y: hidden; max-width: 100%; color: inherit; }
.bubble mjx-container[display="true"] { margin: 10px 0; }
.bubble ul { padding-left: 18px; margin: 6px 0; }
.bubble li { margin: 3px 0; }
/* 回复下方的推荐追问按钮 */
.suggest-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.suggest-chip {
  appearance: none;
  border: 1px solid rgba(103, 232, 249, 0.32);
  background: rgba(103, 232, 249, 0.08);
  color: var(--cyan);
  border-radius: 999px;
  padding: 5px 13px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s ease;
}
.suggest-chip:hover { color: #fff; background: linear-gradient(135deg, #67e8f9, #a78bfa); border-color: transparent; box-shadow: 0 4px 14px rgba(103, 232, 249, 0.25); }
.typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
.typing i {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--cyan);
  animation: typingBounce 1s ease-in-out infinite;
}
.typing i:nth-child(2) { animation-delay: 0.15s; }
.typing i:nth-child(3) { animation-delay: 0.3s; }
@keyframes typingBounce {
  0%, 100% { opacity: 0.3; transform: translateY(0); }
  50% { opacity: 1; transform: translateY(-4px); }
}

/* 对话内的新闻引用卡片 */
.cite-list { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.cite-card {
  display: block;
  text-decoration: none;
  padding: 12px 14px;
  border-radius: 12px;
  background: rgba(8, 18, 34, 0.6);
  border: 1px solid rgba(103, 232, 249, 0.22);
  transition: border-color 0.25s ease, box-shadow 0.25s ease;
}
.cite-card:hover { border-color: rgba(103, 232, 249, 0.5); box-shadow: 0 4px 16px rgba(103, 232, 249, 0.12); }
.cite-title { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.5; margin-bottom: 5px; }
.cite-meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.cite-meta .cite-src { color: var(--cyan); }

/* ================= 分子结构卡片(对话内渲染) ================= */
@keyframes molSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.mol-chat { display: flex; align-items: center; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
.mol-img-wrap {
  flex: 0 0 auto;
  width: 150px;
  height: 150px;
  border-radius: 14px;
  background: #f4f8fb; /* PubChem 结构图为黑线透明底,需浅色底才能看清 */
  border: 1px solid rgba(103, 232, 249, 0.35);
  box-shadow: 0 0 20px rgba(103, 232, 249, 0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.mol-img-wrap img { max-width: 92%; max-height: 92%; display: block; }
/* 3D 分子查看器容器 */
.mol-3d-box { width: 220px; height: 200px; cursor: grab; }
.mol-3d-box:active { cursor: grabbing; }
.mol-3d { width: 100%; height: 100%; position: relative; }
.mol-3d-loading { font-size: 11px; color: #5b7a8c; text-align: center; padding-top: 86px; }
/* 化学反应演示卡片:反应物与生成物同屏展示,动画箭头指向生成方向 */
.rxn-stage {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  min-height: 200px;
  margin-top: 10px;
  padding: 28px 14px 14px;
  border-radius: 14px;
  background: rgba(4, 10, 22, 0.5);
  border: 1px solid rgba(103, 232, 249, 0.25);
  box-shadow: 0 0 20px rgba(103, 232, 249, 0.08);
  overflow-x: auto;
}
.rxn-side { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.rxn-arrow-big {
  flex: 0 0 auto;
  font-size: 28px;
  font-weight: 900;
  color: var(--cyan);
  text-shadow: 0 0 12px rgba(103, 232, 249, 0.6);
  animation: rxnPulse 1.6s ease-in-out infinite;
}
@keyframes rxnPulse {
  0%, 100% { opacity: 0.45; transform: translateX(0); }
  50% { opacity: 1; transform: translateX(5px); }
}
.rxn-label {
  position: absolute;
  top: 8px;
  left: 12px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--cyan);
}
.rxn-label.rxn-label-r { left: auto; right: 12px; color: var(--violet); }
.rxn-mol {
  width: 130px;
  height: 150px;
  position: relative;
  border-radius: 10px;
  background: #f4f8fb;
  overflow: hidden;
  cursor: grab;
}
.rxn-mol:active { cursor: grabbing; }
.rxn-mol-fallback {
  font-size: 11px;
  color: #33475b;
  padding: 8px;
  word-break: break-all;
  font-family: monospace;
}
.mol-chat-props { min-width: 0; flex: 1; }
.mol-prop { display: flex; gap: 6px; font-size: 12px; margin-top: 3px; }
.mol-prop dt { color: var(--muted); flex: 0 0 auto; }
.mol-prop dd { color: #e0f2fe; font-weight: 600; word-break: break-all; margin: 0; }

/* 附加文献栏(拖拽/点击手柄后显示) */
.attach-bar {
  flex: 0 0 auto;
  max-width: 860px;
  width: 100%;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.attach-bar[hidden] { display: none; }
.attach-label { font-size: 12px; color: var(--muted); }
.attach-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  max-width: 320px;
  padding: 6px 8px 6px 12px;
  border-radius: 999px;
  border: 1px solid rgba(103, 232, 249, 0.4);
  background: rgba(103, 232, 249, 0.1);
  font-size: 12px;
  color: #d8f6ff;
}
.attach-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attach-chip button {
  appearance: none;
  border: none;
  background: rgba(251, 113, 133, 0.18);
  color: var(--coral);
  width: 18px;
  height: 18px;
  border-radius: 50%;
  font-size: 11px;
  cursor: pointer;
  flex: 0 0 auto;
  line-height: 1;
}
.attach-chip button:hover { background: rgba(251, 113, 133, 0.4); color: #fff; }

/* 聊天区拖放高亮 */
.chat-scroll.drop-target { border-color: rgba(103, 232, 249, 0.6); box-shadow: 0 0 0 3px rgba(103, 232, 249, 0.15), 0 22px 70px rgba(0, 0, 0, 0.22); }

/* 卡片拖拽手柄(点击或拖拽附加给 Agent) */
.drag-handle {
  position: absolute;
  top: 10px;
  right: 48px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid rgba(103, 232, 249, 0.3);
  background: rgba(8, 18, 34, 0.6);
  color: rgba(103, 232, 249, 0.6);
  font-size: 14px;
  cursor: grab;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s ease;
  user-select: none;
}
.drag-handle:hover { color: #fff; border-color: var(--cyan); box-shadow: 0 0 12px rgba(103, 232, 249, 0.4); transform: scale(1.12); }
.drag-handle:active { cursor: grabbing; }

/* ================= 底部输入区 ================= */
.composer {
  flex: 0 0 auto;
  max-width: 860px;
  width: 100%;
  margin: 0 auto;
  display: flex;
  gap: 10px;
  align-items: flex-end;
  padding: 10px;
  border-radius: 16px;
  border: 1px solid rgba(167, 139, 250, 0.3);
  background: rgba(8, 18, 34, 0.45);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 0 24px rgba(167, 139, 250, 0.08);
}
#composerInput {
  flex: 1;
  min-width: 0;
  appearance: none;
  border: none;
  outline: none;
  background: transparent;
  color: var(--text);
  font-size: 14.5px;
  line-height: 1.6;
  padding: 8px 10px;
  resize: none;
  max-height: 120px;
  font-family: inherit;
}
#composerInput::placeholder { color: rgba(210, 232, 255, 0.35); }
#composerSend {
  appearance: none;
  border: none;
  border-radius: 12px;
  padding: 10px 22px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  color: #fff;
  background: linear-gradient(135deg, #a78bfa, #67e8f9);
  transition: box-shadow 0.25s ease;
  white-space: nowrap;
}
#composerSend:hover:not(:disabled) { box-shadow: 0 6px 18px rgba(167, 139, 250, 0.4); }
#composerSend:disabled { opacity: 0.6; cursor: wait; }

/* ================= 拖拽分割线 ================= */
.divider {
  flex: 0 0 auto;
  width: 8px;
  cursor: col-resize;
  display: none;
  position: relative;
  z-index: 20;
}
.divider::after {
  content: "";
  position: absolute;
  left: 3px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: rgba(103, 232, 249, 0.2);
  transition: background 0.2s ease;
}
.divider:hover::after, body.dragging .divider::after { background: rgba(103, 232, 249, 0.6); }
.workspace.news-open .divider { display: block; }
body.dragging { cursor: col-resize; user-select: none; }

/* ================= 新闻子面板(可停靠可关闭) ================= */
.news-panel {
  flex: 0 0 auto;
  width: 0;
  overflow: hidden;
  opacity: 0;
  transition: width 0.35s ease, opacity 0.3s ease;
  display: flex;
  flex-direction: column;
  border-left: 1px solid rgba(125, 211, 252, 0.14);
  background: rgba(3, 8, 20, 0.55);
  backdrop-filter: blur(16px) saturate(120%);
  -webkit-backdrop-filter: blur(16px) saturate(120%);
}
.workspace.news-open .news-panel { width: var(--news-w); opacity: 1; }
.news-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid rgba(125, 211, 252, 0.12);
  min-width: 300px;
}
.news-head h2 {
  font-size: 16px;
  font-weight: 800;
  background: linear-gradient(90deg, #7dd3fc, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  white-space: nowrap;
}
.news-close {
  appearance: none;
  border: 1px solid rgba(251, 113, 133, 0.35);
  background: rgba(251, 113, 133, 0.1);
  color: var(--coral);
  width: 30px;
  height: 30px;
  border-radius: 9px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
  flex: 0 0 auto;
}
.news-close:hover { background: rgba(251, 113, 133, 0.25); color: #fff; }
.news-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 14px 16px 40px;
  min-width: 300px;
}
.backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(1, 2, 8, 0.55);
  z-index: 40;
}

/* 选中文本快捷解读按钮 */
.sel-pop {
  position: fixed;
  z-index: 90;
  appearance: none;
  border: 1px solid rgba(167, 139, 250, 0.5);
  background: rgba(24, 16, 48, 0.92);
  color: #ddd6fe;
  border-radius: 10px;
  padding: 7px 14px;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 16px rgba(167, 139, 250, 0.25);
  transition: transform 0.15s ease;
}
.sel-pop:hover { color: #fff; background: linear-gradient(135deg, #a78bfa, #67e8f9); }
.sel-pop[hidden] { display: none; }

/* ================= 新闻面板内部组件(迁移自原版) ================= */
.stats-bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 14px;
  padding: 10px 14px;
  margin-bottom: 14px;
  border-radius: 12px;
  background: rgba(4, 10, 22, 0.6);
  border: 1px solid rgba(167, 139, 250, 0.18);
  font-size: 12.5px;
  color: var(--muted);
}
.stats-bar .st-date { letter-spacing: 0.06em; font-weight: 600; }
.stats-bar .st-num { color: var(--cyan); font-weight: 800; }
.stats-bar .st-num.important { color: var(--coral); }
.stats-bar .st-cat { display: inline-flex; align-items: center; gap: 6px; }
.stats-bar .st-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
.st-dot.award { background: #f59e0b; }
.st-dot.product { background: #22c55e; }
.st-dot.company { background: #3b82f6; }
.st-dot.research { background: #8b5cf6; }
.stats-bar .st-source { width: 100%; font-size: 11px; color: rgba(210, 232, 255, 0.35); }

.filters {
  display: flex;
  gap: 6px;
  padding: 8px;
  margin-bottom: 12px;
  border-radius: 12px;
  background: rgba(3, 10, 22, 0.5);
  border: 1px solid rgba(103, 232, 249, 0.1);
}
.filter-btn {
  flex: 1;
  appearance: none;
  border: none;
  background: transparent;
  color: rgba(226, 246, 255, 0.6);
  border-radius: 9px;
  padding: 9px 4px;
  font-size: 12.5px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.3s ease;
  white-space: nowrap;
}
.filter-btn:hover { color: #fff; }
.filter-btn.active {
  color: #fff;
  background: linear-gradient(135deg, #67e8f9, #a78bfa);
  box-shadow: 0 6px 18px rgba(103, 232, 249, 0.25);
}

.search-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
#aiSearchInput {
  flex: 1;
  min-width: 140px;
  appearance: none;
  border: 1px solid rgba(167, 139, 250, 0.3);
  background: rgba(8, 18, 34, 0.55);
  color: var(--text);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13px;
  outline: none;
  transition: border-color 0.25s ease, box-shadow 0.25s ease;
}
#aiSearchInput::placeholder { color: rgba(210, 232, 255, 0.35); }
#aiSearchInput:focus { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.15); }
.search-btn {
  appearance: none;
  border: none;
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  color: #fff;
  background: linear-gradient(135deg, #a78bfa, #67e8f9);
  transition: box-shadow 0.25s ease;
  white-space: nowrap;
}
.search-btn:hover:not(:disabled) { box-shadow: 0 6px 18px rgba(167, 139, 250, 0.4); }
.search-btn:disabled { opacity: 0.6; cursor: wait; }
.search-clear-btn {
  appearance: none;
  border: 1px solid rgba(251, 113, 133, 0.4);
  background: rgba(251, 113, 133, 0.12);
  color: var(--coral);

/* 排行榜 */
.ranking-section { margin-bottom: 18px; }
.ranking-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.ranking-header h3 {
  font-size: 15px;
  font-weight: 700;

}
.ranking-hint { font-size: 11px; color: rgba(210, 232, 255, 0.4); }
.ranking-carousel { height: 264px; overflow: hidden; position: relative; }
.ranking-inner { transition: transform 0.6s cubic-bezier(0.25, 0.1, 0.25, 1); }
.ranking-loading { color: rgba(210, 232, 255, 0.4); font-size: 13px; text-align: center; padding: 24px; }
.ranking-card {

.ranking-card:hover { border-color: rgba(103, 232, 249, 0.4); box-shadow: 0 4px 16px rgba(103, 232, 249, 0.1); }
.ranking-card.top3 {
  border-color: rgba(251, 113, 133, 0.4);

}

.ranking-title.top1, .ranking-title.top2, .ranking-title.top3 {
  font-weight: 800;
  background: linear-gradient(90deg, #f43f5e, #fb7185, #fbbf24);

  -webkit-text-fill-color: transparent;
}
.ranking-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
.ranking-source { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ranking-count { color: var(--coral); font-weight: 600; }
.flame-icon { position: absolute; top: -6px; right: -2px; width: 16px; height: 20px; pointer-events: none; z-index: 5; }
.flame-icon::before {
  content: '';
  position: absolute;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 12px; height: 18px;
  background: linear-gradient(to top, rgba(255,69,0,0.9) 0%, rgba(255,140,0,0.8) 30%, rgba(255,200,0,0.6) 60%, rgba(255,255,200,0.3) 90%, transparent 100%);
  border-radius: 50% 50% 30% 30% / 60% 60% 40% 40%;
  filter: blur(1.5px);
  animation: flameDance 0.8s ease-in-out infinite alternate;
  transform-origin: bottom center;
}
@keyframes flameDance {
  0% { transform: translateX(-50%) scale(0.9, 0.95) rotate(-3deg); }
  50% { transform: translateX(-48%) scale(0.95, 1.05) rotate(3deg); }
  100% { transform: translateX(-50%) scale(1.1, 1.15) rotate(2deg); }
}

/* 热点标签 chips(Agent 对话内) */
.tag-chip {
  appearance: none;
  display: inline-flex;
  align-items: center;

}

.tag-count { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; background: rgba(255, 255, 255, 0.15); }

/* 新闻卡片 */
.news-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
.story {

}

.story-featured {

}
.story-meta-line { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.story-time { font-size: 11.5px; font-weight: 800; letter-spacing: 0.04em; color: var(--cyan); font-family: monospace; white-space: nowrap; }
.story-tag { padding: 3px 9px; border-radius: 4px; font-size: 11px; font-weight: 900; letter-spacing: 0.08em; color: #03101d; }
.story-tag.award { background: linear-gradient(135deg, #fde68a, #f59e0b); }
.story-tag.product { background: linear-gradient(135deg, #86efac, #22c55e); }
.story-tag.company { background: linear-gradient(135deg, #93c5fd, #3b82f6); }
.story-tag.research { background: linear-gradient(135deg, #c4b5fd, #8b5cf6); }
.story-important {

  border-radius: 4px;
  font-size: 11px;
  font-weight: 900;

}
.story-title-xl {

}

.story-summary-lg { font-size: 13.5px; line-height: 1.8; color: rgba(210, 232, 255, 0.82); margin-bottom: 12px; }
.story-summary { font-size: 13px; line-height: 1.75; color: var(--muted); margin-bottom: 12px; }
.story-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.story-source { font-size: 12px; color: rgba(224, 242, 254, 0.5); letter-spacing: 0.04em; }
.story-link {

  align-items: center;

  color: var(--cyan);

  font-size: 12.5px;

}
.story-link:hover { border-color: var(--cyan); text-shadow: 0 0 8px rgba(103, 232, 249, 0.5); }
.story-foot-actions { display: inline-flex; align-items: center; gap: 8px; }
.molecule-deco { position: absolute; top: 16px; right: 4px; width: 46px; height: 46px; opacity: 0.25; pointer-events: none; animation: molSpin 10s linear infinite; }

/* 收藏按钮 */
.fav-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid rgba(251, 113, 133, 0.3);

.fav-btn.favorited { color: #f43f5e; border-color: #f43f5e; background: rgba(244, 63, 94, 0.2); box-shadow: 0 0 12px rgba(244, 63, 94, 0.5); }

/* AI 解读 */
.explain-btn {

/* 空状态与骨架屏 */
.empty {
  display: none;
  margin-top: 24px;

}
.skeleton-card { pointer-events: none; }
.sk-line {
  border-radius: 6px;
  background: linear-gradient(90deg, rgba(148, 163, 184, 0.1), rgba(148, 163, 184, 0.22), rgba(148, 163, 184, 0.1));

}

.sk-text { width: 100%; height: 12px; margin-bottom: 7px; }
.sk-text.short { width: 55%; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ================= 今日分子开机卡 & 元素周期表 ================= */
.motd-overlay, .pte-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(1, 2, 8, 0.6);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  padding: 16px;
}
.motd-overlay[hidden], .pte-overlay[hidden] { display: none; }
.motd-card {
  position: relative;
  width: min(92vw, 560px);
  border-radius: 20px;
  border: 1px solid rgba(103, 232, 249, 0.35);
  background: linear-gradient(145deg, rgba(8, 18, 34, 0.85), rgba(10, 12, 34, 0.8));
  backdrop-filter: blur(18px) saturate(130%);
  -webkit-backdrop-filter: blur(18px) saturate(130%);

  padding: 22px 24px;
  animation: motdIn 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2);
}
@keyframes motdIn {
  from { opacity: 0; transform: translateY(24px) scale(0.96); }
  to { opacity: 1; transform: none; }
}
.motd-close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 30px;
  height: 30px;
  border-radius: 9px;
  border: 1px solid rgba(251, 113, 133, 0.35);
  background: rgba(251, 113, 133, 0.1);
  color: var(--coral);
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s ease;
  z-index: 2;
}
.motd-close:hover { background: rgba(251, 113, 133, 0.3); color: #fff; }
.motd-title {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.16em;
  color: var(--cyan);
  margin-bottom: 14px;
}
.motd-body { display: flex; gap: 18px; align-items: center; }
.motd-3d {
  flex: 0 0 auto;
  width: 190px;
  height: 190px;
  border-radius: 14px;
  background: #f4f8fb;
  border: 1px solid rgba(103, 232, 249, 0.35);
  box-shadow: 0 0 24px rgba(103, 232, 249, 0.15);
  overflow: hidden;
  position: relative;
  cursor: grab;
}
.motd-3d:active { cursor: grabbing; }
.motd-3d img { max-width: 92%; max-height: 92%; margin: 4%; }
.motd-info { min-width: 0; }
.motd-info b {
  display: block;
  font-size: 20px;
  margin-bottom: 8px;
  background: linear-gradient(90deg, #cffafe, #a78bfa);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.motd-info p { font-size: 13px; line-height: 1.8; color: var(--muted); margin-bottom: 14px; }
.motd-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.motd-ask {
  appearance: none;
  border: none;
  border-radius: 10px;
  padding: 9px 18px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  color: #fff;
  background: linear-gradient(135deg, #67e8f9, #a78bfa);
  transition: box-shadow 0.25s ease;
}
.motd-ask:hover { box-shadow: 0 6px 18px rgba(103, 232, 249, 0.4); }
.motd-ok {
  appearance: none;
  border: 1px solid rgba(103, 232, 249, 0.35);
  background: rgba(103, 232, 249, 0.1);
  color: var(--cyan);
  border-radius: 10px;
  padding: 9px 16px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.motd-ok:hover { background: rgba(103, 232, 249, 0.2); }

/* 周期表 */
.pte-card {
  position: relative;
  width: min(96vw, 1080px);
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  border-radius: 20px;
  border: 1px solid rgba(103, 232, 249, 0.3);
  background: linear-gradient(145deg, rgba(8, 18, 34, 0.9), rgba(10, 12, 34, 0.85));
  backdrop-filter: blur(18px) saturate(130%);
  -webkit-backdrop-filter: blur(18px) saturate(130%);
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5);
  padding: 18px 20px;
}
.pte-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.pte-head h3 {
  font-size: 17px;
  font-weight: 800;
  background: linear-gradient(90deg, #7dd3fc, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.pte-head .motd-close { position: static; }
.pte-scroll { overflow: auto; flex: 1; min-height: 0; }
.pte-grid {

.pte-el {

}
.pte-el:hover { transform: scale(1.18); z-index: 3; box-shadow: 0 0 14px currentColor; }
.pte-el i { font-style: normal; font-size: 8px; opacity: 0.65; align-self: flex-start; padding-left: 3px; }
.pte-el b { font-size: 14px; font-weight: 800; }
.pte-el span { font-size: 9px; opacity: 0.85; }
.pte-el.cat-alkali { border-color: rgba(251,113,133,.5); color: #fb7185; }
.pte-el.cat-alkaline { border-color: rgba(251,191,36,.5); color: #fbbf24; }
.pte-el.cat-transition { border-color: rgba(96,165,250,.5); color: #60a5fa; }
.pte-el.cat-post { border-color: rgba(52,211,153,.5); color: #34d399; }
.pte-el.cat-metalloid { border-color: rgba(163,230,53,.5); color: #a3e635; }
.pte-el.cat-nonmetal { border-color: rgba(103,232,249,.55); color: #67e8f9; }
.pte-el.cat-halogen { border-color: rgba(244,114,182,.5); color: #f472b6; }
.pte-el.cat-noble { border-color: rgba(167,139,250,.55); color: #a78bfa; }
.pte-el.cat-lanthanide { border-color: rgba(196,181,253,.5); color: #c4b5fd; }
.pte-el.cat-actinide { border-color: rgba(240,171,252,.5); color: #f0abfc; }
.pte-gap {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  color: var(--muted);
  border: 1px dashed rgba(148, 163, 184, 0.3);

  line-height: 1.2;
}
.pte-detail {
  margin-top: 12px;
  min-height: 52px;
  border-radius: 12px;
  border: 1px solid rgba(103, 232, 249, 0.2);

.pte-detail .pte-sym { font-size: 26px; font-weight: 900; color: var(--cyan); }
.pte-detail .pte-name { font-size: 15px; font-weight: 700; }
.pte-detail .pte-meta { font-size: 12px; color: var(--muted); }
.pte-ask {
  appearance: none;
  border: none;
  margin-left: auto;
  border-radius: 9px;
  padding: 8px 16px;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  color: #fff;
  background: linear-gradient(135deg, #67e8f9, #a78bfa);
  white-space: nowrap;
}
.pte-ask:hover { box-shadow: 0 4px 14px rgba(103, 232, 249, 0.35); }

/* ================= 会话知识库 ================= */
.kb-badge {
  display: inline-block;
  min-width: 18px;
  padding: 1px 5px;
  margin-left: 4px;
  border-radius: 8px;
  background: rgba(103, 232, 249, 0.2);

}
.kb-card { width: min(94vw, 620px); }
.kb-hint { font-size: 12.5px; color: var(--muted); line-height: 1.7; margin-bottom: 12px; }
.kb-hint b { color: var(--cyan); }
.kb-list { max-height: 50vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.kb-list:empty::after { content: "知识库还是空的——把新闻卡片 ⠿ 拖给 Agent 读一篇网页试试。"; font-size: 12.5px; color: var(--muted); padding: 14px 4px; display: block; }
.kb-item {

.kb-item-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

  font-size: 12px;

  cursor: pointer;
}
.kb-clear:hover { background: rgba(251, 113, 133, 0.22); }

/* ================= 移动端:Agent 全屏 + 新闻抽屉 ================= */
@media (max-width: 768px) {
  .agent { padding: 12px 10px; }
  .topbar { padding: 10px 14px; }
  .stats-chip { display: none; }
  .divider { display: none !important; }
  .news-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(92vw, 430px);
    opacity: 1;
    transform: translateX(105%);
    transition: transform 0.35s ease;
    z-index: 50;
    box-shadow: -20px 0 60px rgba(0, 0, 0, 0.5);
  }
  .workspace.news-open .news-panel { width: min(92vw, 430px); transform: translateX(0); }
  .workspace.news-open ~ .backdrop, .backdrop.show { display: block; }
  .bubble { max-width: 88%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;

<script>
/* =========================================================
   化学智能体工作台 · 单文件应用
   结构: Agent 工作台(默认主体) + 新闻文献子面板(可唤起/可关闭)
   ========================================================= */

// ===== 分类标签 =====
const CATEGORY_LABEL = { award: "奖项", product: "产品", company: "公司", research: "研究" };
let categoryLabels = CATEGORY_LABEL;

// ===== DOM =====
const $ = (id) => document.getElementById(id);
const chatInner = $("chatInner"), chatScroll = $("chatScroll");
const composerInput = $("composerInput"), composerSend = $("composerSend");
const workspace = $("workspace"), newsPanel = $("newsPanel"), divider = $("divider");
const newsToggle = $("newsToggle"), newsClose = $("newsClose"), backdrop = $("backdrop");
const masonryEl = $("masonry"), emptyEl = $("emptyState"), favEmptyEl = $("favEmptyState");
const heroStatsEl = $("heroStats"), statsChip = $("statsChip");
const rankingCarouselEl = $("rankingCarousel");
const aiSearchInput = $("aiSearchInput"), aiSearchBtn = $("aiSearchBtn"), aiSearchClear = $("aiSearchClear");
const selPop = $("selPop");

// ===== 全局状态 =====
let newsData = [];
let currentFilter = "all";
let activeFilters = new Set();
let searchIndices = null;
let searchQueryText = "";
let newsIndexMap = {};

// ===== 工具 =====
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function getVisitorId() {
  let id = localStorage.getItem("visitor_id");
  if (!id) {
    id = "v-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("visitor_id", id);
  }
  return id;
}
const VISITOR_ID = getVisitorId();

// ===== 收藏管理 =====
function getLocalFavorites() {
  try { return JSON.parse(localStorage.getItem("favorites") || "[]"); } catch { return []; }
}
function saveLocalFavorites(favs) { localStorage.setItem("favorites", JSON.stringify(favs)); }
function isFavorited(title) { return getLocalFavorites().some(f => f.title === title); }
function toggleFavorite(item) {
  const favs = getLocalFavorites();
  const idx = favs.findIndex(f => f.title === item.title);
  if (idx >= 0) {
    favs.splice(idx, 1);
    saveLocalFavorites(favs);
    fetch("/api/favorites", {
      method: "DELETE", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ visitor_id: VISITOR_ID, news_title: item.title }),
    }).then(() => loadRanking()).catch(() => {});
  } else {
    favs.push({ title: item.title, url: item.url, source: item.source, type: item.type, summary: item.summary });
    saveLocalFavorites(favs);
    fetch("/api/favorites", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        visitor_id: VISITOR_ID, news_title: item.title, news_url: item.url,
        news_source: item.source, news_type: item.type, news_summary: item.summary,
      }),
    }).then(() => loadRanking()).catch(() => {});
  }
  updateFavoriteButtons();
  renderStats();
  renderNews(currentFilter === "favorites" ? "favorites" : currentFilter);
}
function updateFavoriteButtons() {
  document.querySelectorAll(".fav-btn").forEach(btn => {
    const item = newsIndexMap[parseInt(btn.dataset.index)];
    if (item) {
      const fav = isFavorited(item.title);
      btn.classList.toggle("favorited", fav);
      btn.textContent = fav ? "♥" : "♡";
    }
  });
}

// ===== 标题显示 =====
// (翻译功能已迁移至 Agent 对话:直接对 Agent 说"翻译这条新闻"即可)
function displayName(item) { return item.title; }

// ===== AI 解读缓存 =====
let explainCache = {};
try { explainCache = JSON.parse(localStorage.getItem("ai_explains") || "{}"); } catch { explainCache = {}; }
function saveExplainCache() { localStorage.setItem("ai_explains", JSON.stringify(explainCache)); }
const expandedExplains = new Set();
function explainBtnHtml(item) {
  const expanded = expandedExplains.has(item.title);
  return `<button class="explain-btn" data-title="${encodeURIComponent(item.title)}" title="DeepSeek 通俗解读">${expanded ? "收起解读" : "✨ AI 解读"}</button>`;
}
function explainPanelHtml(item) {
  if (!expandedExplains.has(item.title) || !explainCache[item.title]) return "";
  return `<div class="explain-panel">${escapeHtml(explainCache[item.title])}</div>`;
}

/* =========================================================
   Agent 工作台
   ========================================================= */

// ----- Agent 后端对接 -----
// 默认实现:调用本站 /api/ai/chat(DeepSeek)。
// 如需换成其他 Agent 后端,设置 window.AGENT_BACKEND_HOOK = async (text, ctx) => replyHtml 即可覆盖。
window.AGENT_BACKEND_HOOK = window.AGENT_BACKEND_HOOK || null;

// 对话历史(纯文本,用于多轮上下文)
const chatHistory = [];

// ===== 会话知识库(sessionStorage 持久化,刷新不丢) =====
let knowledgeBase = [];
try { knowledgeBase = JSON.parse(sessionStorage.getItem("knowledge_base") || "[]"); } catch { knowledgeBase = []; }
function saveKB() {
  sessionStorage.setItem("knowledge_base", JSON.stringify(knowledgeBase));
  $("kbCount").textContent = knowledgeBase.length;
}
function addToKB(a) {
  if (!a || !a.url) return;
  if (knowledgeBase.some(k => k.url === a.url)) return;
  knowledgeBase.unshift({ title: a.title, url: a.url, source: a.source || "", summary: a.summary || "", checked: true });
  saveKB();
  renderKBList();
}
function removeFromKB(url) {
  knowledgeBase = knowledgeBase.filter(k => k.url !== url);
  saveKB();
  renderKBList();
}
function renderKBList() {
  const list = $("kbList");
  list.innerHTML = knowledgeBase.map(k => `
    <div class="kb-item ${k.checked ? "checked" : ""}" data-url="${escapeHtml(k.url)}">
      <input type="checkbox" class="kb-check" ${k.checked ? "checked" : ""} title="勾选后,后续对话携带该网页全文">
      <div class="kb-item-body">
        <a class="kb-item-title" href="${escapeHtml(k.url)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(k.title)}">📄 ${escapeHtml(k.title)}</a>
        <div class="kb-item-meta">${escapeHtml(k.source || "")}</div>
      </div>
      <button class="kb-remove" title="移出知识库">✕</button>
    </div>`).join("");
}
$("kbList").addEventListener("change", (e) => {
  const box = e.target.closest(".kb-check");
  if (!box) return;
  const url = box.closest(".kb-item").dataset.url;
  const item = knowledgeBase.find(k => k.url === url);
  if (item) { item.checked = box.checked; saveKB(); }
  box.closest(".kb-item").classList.toggle("checked", box.checked);
});
$("kbList").addEventListener("click", (e) => {
  const btn = e.target.closest(".kb-remove");
  if (!btn) return;
  removeFromKB(btn.closest(".kb-item").dataset.url);
});
$("kbClear").addEventListener("click", () => {
  knowledgeBase = [];
  saveKB();
  renderKBList();
});
const kbOverlay = $("kbOverlay");
$("kbToggle").addEventListener("click", () => { renderKBList(); kbOverlay.hidden = false; });
$("kbClose").addEventListener("click", () => { kbOverlay.hidden = true; });
kbOverlay.addEventListener("click", (e) => { if (e.target === kbOverlay) kbOverlay.hidden = true; });

// 调用 /api/ai/chat(流式),onUpdate 回调累计文本,最终返回完整回复
async function streamAgentChat(text, onUpdate) {
  // 文献载荷 = 本次附加的 chips ∪ 知识库勾选条目(按 URL 去重,上限 3 篇)
  const merged = [
    ...attachedArticles.map(a => ({ title: a.title, url: a.url, summary: a.summary, source: a.source })),
    ...knowledgeBase.filter(k => k.checked).map(k => ({ title: k.title, url: k.url, summary: k.summary, source: k.source })),
  ].filter((v, i, arr) => v.url && arr.findIndex(x => x.url === v.url) === i).slice(0, 3);
  const resp = await fetch("/api/ai/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      message: text,
      history: chatHistory.slice(-10),
      news: newsData.slice(0, 15).map(n => ({ title: n.title, summary: n.summary, type: n.type })),
      articles: merged,
    }),
  });
  if (!resp.ok || !resp.body) {
    let msg = "Agent 接口错误 " + resp.status;
    try { msg = (await resp.json()).message || msg; } catch {}
    throw new Error(msg);
  }
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let acc = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    acc += decoder.decode(value, { stream: true });
    if (onUpdate) onUpdate(acc);
  }
  if (!acc.trim()) throw new Error("DeepSeek 返回空内容");
  return acc;
}

// 流式渲染时隐藏尾部可能出现的未完成标记([MOL]/[SUGGEST] 不半截显示)
function visibleStreamText(acc) {
  let cut = acc.length;
  const upper = acc.toUpperCase();
  for (const m of ["[MOL]", "[RXN]", "[SUGGEST]"]) {
    const full = upper.indexOf(m);
    if (full >= 0) cut = Math.min(cut, full);
    for (let k = 1; k < m.length; k++) {
      if (upper.endsWith(m.slice(0, k))) { cut = Math.min(cut, acc.length - k); break; }
    }
  }
  return acc.slice(0, cut);
}

// AI 纯文本回复 → 气泡 HTML(转义 + 换行/列表简单排版)
function fmtReply(text) {
  return escapeHtml(text)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/\n/g, "<br>");
}

// 推荐追问按钮组
function suggestChipsHtml(questions) {
  const list = questions.map(q => q.trim()).filter(q => q && q.length <= 40).slice(0, 3);
  if (list.length === 0) return "";
  return `<div class="suggest-chips">` + list.map(q =>
    `<button class="suggest-chip" data-q="${escapeHtml(q)}">💬 ${escapeHtml(q)}</button>`).join("") + `</div>`;
}

// ===== 附加文献(拖拽/点击手柄) =====
const attachedArticles = [];
const attachBar = $("attachBar");

function renderAttachBar() {
  if (attachedArticles.length === 0) {
    attachBar.hidden = true;
    attachBar.innerHTML = "";
    return;
  }
  attachBar.hidden = false;
  attachBar.innerHTML = '<span class="attach-label">📎 附加给 Agent:</span>' + attachedArticles.map((a, i) =>
    `<span class="attach-chip"><span title="${escapeHtml(a.title)}">《${escapeHtml(displayName(a))}》</span><button data-rm="${i}" title="移除">✕</button></span>`).join("");
}
attachBar.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-rm]");
  if (!btn) return;
  attachedArticles.splice(parseInt(btn.dataset.rm), 1);
  renderAttachBar();
});
function attachArticle(item) {
  if (!item) return;
  if (attachedArticles.some(a => a.title === item.title)) return; // 去重
  if (attachedArticles.length >= 3) attachedArticles.shift(); // 最多 3 篇
  attachedArticles.push({ title: item.title, url: item.url || "", summary: item.summary || "", source: item.source || "" });
  renderAttachBar();
  addMessage("ai", `已把文献<b>《${escapeHtml(displayName(item))}》</b>附加到对话 📎,我会阅读它的网页内容后回答你的相关问题。可同时附加多篇(最多 3 篇),点芯片上的 ✕ 移除。`);
}

// 卡片手柄:拖拽或点击都能附加
masonryEl.addEventListener("dragstart", (e) => {
  const handle = e.target.closest(".drag-handle");
  if (!handle) return;
  e.dataTransfer.setData("text/x-news-index", handle.dataset.dragidx);
  e.dataTransfer.effectAllowed = "copy";
  const card = handle.closest(".story");
  if (card) e.dataTransfer.setDragImage(card, 24, 24);
  chatScroll.classList.add("drop-target");
});
masonryEl.addEventListener("dragend", () => chatScroll.classList.remove("drop-target"));
masonryEl.addEventListener("click", (e) => {
  const handle = e.target.closest(".drag-handle");
  if (!handle) return;
  e.preventDefault();
  attachArticle(newsIndexMap[parseInt(handle.dataset.dragidx)]);
});

// 聊天区接收拖放
chatScroll.addEventListener("dragover", (e) => {
  if (e.dataTransfer.types.includes("text/x-news-index")) {
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
  }
});
chatScroll.addEventListener("drop", (e) => {
  const idx = e.dataTransfer.getData("text/x-news-index");
  chatScroll.classList.remove("drop-target");
  if (idx === "") return;
  e.preventDefault();
  attachArticle(newsIndexMap[parseInt(idx)]);
});

function scrollChat() { chatScroll.scrollTop = chatScroll.scrollHeight; }

// 渲染气泡内的数学/化学公式(MathJax 异步加载,未就绪时延迟重试)
function typesetMath(el) {
  if (window.MathJax && window.MathJax.typesetPromise) {
    window.MathJax.typesetPromise([el]).catch(() => {});
  } else {
    setTimeout(() => {
      if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(() => {});
    }, 1200);
  }
}

function addMessage(role, html) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = `<div class="bubble">${html}</div>`;
  chatInner.appendChild(el);
  scrollChat();
  typesetMath(el);
  return el;
}
function addUserMessage(text) { addMessage("user", escapeHtml(text)); }
function addTyping() { return addMessage("ai", '<span class="typing"><i></i><i></i><i></i></span>'); }

// 新闻引用卡片(渲染在对话消息内)
function citationCardsHtml(items) {
  return `<div class="cite-list">` + items.map(item => `
    <a class="cite-card" href="${item.url || "#"}" target="_blank" rel="noopener noreferrer">
      <div class="cite-title">${escapeHtml(displayName(item))}</div>
      <div class="cite-meta">
        <span class="cite-src">${escapeHtml(item.source || "")}</span>
        <span>${escapeHtml(categoryLabels[item.type] || item.type || "")}</span>
        <span>${escapeHtml(item.time || "")}</span>
      </div>
    </a>`).join("") + `</div>`;
}

// 演示回复(未接入后端时使用)
function stubReply(text) {
  return `我已收到你的问题:「<b>${escapeHtml(text)}</b>」。<br><span class="bubble-hint">当前为前端演示模式,接入 Agent 后端后(见 <code>AGENT_BACKEND_HOOK</code> 钩子),此处将返回真实的化学分析结果。</span><br>你现在可以:<ul><li>输入 <b>/news</b> 唤起新闻文献面板</li><li>说「<b>早报</b>」「<b>热点标签</b>」「<b>为我推荐</b>」获取对应内容</li><li>问我「<b>布洛芬的结构式</b>」直接生成 3D 分子模型 🧬</li><li>在新闻面板中<b>选中任意文本</b>,一键发送给我解读;把卡片 ⠿ 手柄<b>拖到对话区</b>,我会阅读原文网页后作答</li></ul>`;
}

let agentBusy = false;
async function handleUserText(text) {
  if (agentBusy || !text) return;
  agentBusy = true;
  composerSend.disabled = true;
  // 用户气泡:问题 + 附加的文献卡片
  const attachHtml = attachedArticles.length > 0
    ? '<div class="cite-list">' + attachedArticles.map(a =>
        `<a class="cite-card" href="${a.url || "#"}" target="_blank" rel="noopener noreferrer"><div class="cite-title">📎 ${escapeHtml(a.title)}</div><div class="cite-meta"><span class="cite-src">${escapeHtml(a.source || "")}</span></div></a>`
      ).join("") + "</div>"
    : "";
  addMessage("user", escapeHtml(text) + attachHtml);
  const typingEl = addTyping();
  // 发送后:附加文献自动存入会话知识库(默认勾选携带)
  attachedArticles.forEach(addToKB);
  // 附加了文献时,意图显然是讨论文献 → 跳过所有快捷指令,直接对话(携带网页阅读)
  const hasAttach = attachedArticles.length > 0;

  // 意图:分子结构查询 → 对话内直接渲染 3D 结构卡片
  const molQuery = parseMoleculeQuery(text);
  if (!hasAttach && molQuery) {
    const result = await fetchMolecule(molQuery);
    if (!result.error) {
      typingEl.remove();
      const el = addMessage("ai", moleculeCardHtml(result));
      el.querySelectorAll(".mol-3d").forEach(initMol3D);
      agentBusy = false;
      composerSend.disabled = false;
      return;
    }
    // PubChem 未收录(如 NCM 正极材料等非整比材料/聚合物):不再只报错,转交 DeepSeek 讲解
  }

  // 指令:今日早报
  if (!hasAttach && (/^\/?(早报|今日早报|dailybrief)/i.test(text) || text.includes("早报"))) {
    const html = await agentDailyBrief();
    typingEl.remove();
    addMessage("ai", html);
    agentBusy = false;
    composerSend.disabled = false;
    return;
  }

  // 指令:热点标签
  if (!hasAttach && (/^\/?(热点标签|标签|tags)/i.test(text) || text.includes("热点标签"))) {
    const html = await agentHotTags();
    typingEl.remove();
    addMessage("ai", html);
    agentBusy = false;
    composerSend.disabled = false;
    return;
  }

  // 指令:收藏推荐
  if (!hasAttach && (/^\/?(推荐|recommend)/i.test(text) || /(给我|为我|帮我)推荐|收藏推荐/.test(text))) {
    const html = await agentRecommend();
    typingEl.remove();
    addMessage("ai", html);
    agentBusy = false;
    composerSend.disabled = false;
    return;
  }

  // 指令:唤起新闻文献
  if (!hasAttach && (/^\/?news/i.test(text) || text.includes("新闻") || text.includes("文献"))) {
    openNewsPanel();
    await new Promise(r => setTimeout(r, 500));
    typingEl.remove();
    if (newsData.length > 0) {
      addMessage("ai", `已为你唤起新闻文献面板 📰,以下是今日 Top 3 化学资讯:` + citationCardsHtml(newsData.slice(0, 3)));
    } else {
      addMessage("ai", `已为你唤起新闻文献面板 📰,新闻数据加载后可在此查看引用卡片。`);
    }
  } else {
    let replyText = "";
    if (typeof window.AGENT_BACKEND_HOOK === "function") {
      // 自定义后端钩子(返回 HTML,非流式)
      let replyHtml = null;
      try { replyHtml = await window.AGENT_BACKEND_HOOK(text, { newsData, chatHistory }); } catch (e) { console.log("Agent 后端调用失败", e); }
      typingEl.remove();
      addMessage("ai", replyHtml || "⚠️ 智能体暂时无法应答,请稍后再试。");
    } else {
      // 默认:DeepSeek 化学智能体(流式打字机输出)
      typingEl.remove();
      const msgEl = addMessage("ai", '<span class="bubble-hint">正在思考…</span>');
      const bubble = msgEl.querySelector(".bubble");
      try {
        const full = await streamAgentChat(text, (acc) => {
          bubble.innerHTML = fmtReply(visibleStreamText(acc));
          scrollChat();
        });
        // 流结束后处理标记:[MOL] 分子结构、[RXN] 反应演示、[SUGGEST] 推荐追问
        const molMarker = full.match(/\[MOL\]([\s\S]+?)\[\/MOL\]/i);
        const rxnMarker = full.match(/\[RXN\]([\s\S]+?)\[\/RXN\]/i);
        const sugMarker = full.match(/\[SUGGEST\]([\s\S]+?)\[\/SUGGEST\]/i);
        replyText = full
          .replace(/\[MOL\][\s\S]+?\[\/MOL\]/gi, "")
          .replace(/\[RXN\][\s\S]+?\[\/RXN\]/gi, "")
          .replace(/\[SUGGEST\][\s\S]+?\[\/SUGGEST\]/gi, "")
          .trim();
        let replyHtml = fmtReply(replyText);
        if (molMarker) replyHtml += moleculeCardHtml(await fetchMolecule(molMarker[1].trim()));
        if (rxnMarker) replyHtml += reactionCardHtml(rxnMarker[1].trim());
        if (sugMarker) replyHtml += suggestChipsHtml(sugMarker[1].split("|"));
        bubble.innerHTML = replyHtml;
        typesetMath(msgEl);
        bubble.querySelectorAll(".mol-3d").forEach(initMol3D);
        bubble.querySelectorAll(".rxn-stage").forEach(initReaction);
        scrollChat();
      } catch (e) {
        console.log("Agent 对话失败", e);
        bubble.innerHTML = `⚠️ 智能体暂时无法应答(${escapeHtml(e.message || "网络错误")}),请稍后再试。`;
      }
    }
    // 成功的真实回复写入对话历史(注明附件,供后续追问理解上下文)
    if (replyText) {
      const historyText = attachedArticles.length > 0
        ? text + "\n[附加文献:" + attachedArticles.map(a => "《" + a.title + "》").join("") + "]"
        : text;
      chatHistory.push({ role: "user", content: historyText }, { role: "assistant", content: replyText });
      if (chatHistory.length > 20) chatHistory.splice(0, chatHistory.length - 20);
    }
  }
  agentBusy = false;
  composerSend.disabled = false;
}

// ===== 分子结构查询(PubChem PUG REST,免费无密钥;中文名经 DeepSeek 转换) =====
const PUBCHEM = "https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound";

// 根据输入形态决定查询方式优先级:纯分子式 → fastformula;含 SMILES 特征字符 → smiles;其余按名称(三种方式依次尝试,保证命中)
function molQueryKinds(q) {
  if (/^([A-Z][a-z]?\d*)+$/.test(q)) return ["fastformula", "name", "smiles"];
  if (/[()=#\[\]@\\\/+]/.test(q)) return ["smiles", "name", "fastformula"];
  return ["name", "smiles", "fastformula"];
}

// 查询分子结构,返回 { imgUrl, prop, note, query } 或 { error }
async function fetchMolecule(query) {
  query = (query || "").trim();
  if (!query) return { error: "请输入化合物名称" };
  let note = "";
  // 中文名:先用 DeepSeek 转成英文名 + SMILES,再查 PubChem
  if (/[一-龥]/.test(query)) {
    try {
      const resp = await fetch("/api/ai/compound", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: query }),
      });
      const json = await resp.json();
      if (json.code === 200 && json.data && (json.data.smiles || json.data.english)) {
        note = `已自动翻译:「${escapeHtml(query)}」→ <b>${escapeHtml(json.data.english || json.data.smiles)}</b><br>`;
        query = json.data.smiles || json.data.english; // SMILES 查询最精确
      } else {
        return { error: `无法识别「${query}」,请换用更规范的名称,或直接输入英文名 / 分子式 / SMILES。` };
      }
    } catch {
      return { error: "翻译服务暂不可用,请改用英文名 / 分子式 / SMILES 直接查询。" };
    }
  }
  for (const kind of molQueryKinds(query)) {
    try {
      const resp = await fetch(`${PUBCHEM}/${kind}/${encodeURIComponent(query)}/property/MolecularFormula,MolecularWeight,IUPACName,IsomericSMILES/JSON`);
      if (!resp.ok) continue;
      const json = await resp.json();
      const prop = json.PropertyTable && json.PropertyTable.Properties && json.PropertyTable.Properties[0];
      if (prop) {
        return {
          imgUrl: `${PUBCHEM}/${kind}/${encodeURIComponent(query)}/PNG`,
          prop, note, query,
        };
      }
    } catch {}
  }
  return { error: `PubChem 未收录「${query}」——它可能是非整比材料(如 NCM/LFP 电池材料)、混合物或聚合物,不在小分子数据库中。你可以直接问我关于它的问题,我会用已有知识讲解。` };
}

// 对话内分子结构卡片(3D 球棍模型,可拖拽旋转;失败回退 2D 图)
function moleculeCardHtml(r) {
  if (r.error) return `⚠️ ${escapeHtml(r.error)}`;
  const p = r.prop;
  return `
    ${r.note}🧬 <b>${escapeHtml(p.IUPACName || r.query)}</b>
    <div class="mol-chat">
      <span class="mol-img-wrap mol-3d-box" title="拖拽旋转 · 滚轮缩放">
        <div class="mol-3d" data-cid="${p.CID}" data-fallback="${r.imgUrl}"><div class="mol-3d-loading">3D 加载中…</div></div>
      </span>
      <dl class="mol-chat-props">
        <div class="mol-prop"><dt>分子式</dt><dd>${escapeHtml(p.MolecularFormula || "-")}</dd></div>
        <div class="mol-prop"><dt>分子量</dt><dd>${escapeHtml(String(p.MolecularWeight || "-"))} g/mol</dd></div>
        <div class="mol-prop"><dt>SMILES</dt><dd>${escapeHtml(p.IsomericSMILES || "-")}</dd></div>
      </dl>
    </div>
    <span class="bubble-hint">数据源:PubChem CID ${p.CID} · 3D 模型可拖拽旋转、滚轮缩放 · 想进一步了解它的性质?直接继续问我。</span>`;
}

// 初始化 3D 分子查看器(3Dmol.js + PubChem 3D 坐标)
async function initMol3D(container) {
  const cid = container.dataset.cid;
  const fallback = container.dataset.fallback;
  const showFallback = () => { container.innerHTML = `<img src="${fallback}" alt="2D 结构式">`; };
  if (!window.$3Dmol || !cid) { showFallback(); return; }
  try {
    const resp = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/SDF?record_type=3d`);
    if (!resp.ok) throw new Error("no 3d");
    const sdf = await resp.text();
    if (!sdf || sdf.length < 50) throw new Error("empty");
    container.innerHTML = "";
    const viewer = window.$3Dmol.createViewer(container, { backgroundColor: "#f4f8fb" });
    viewer.addModel(sdf, "sdf");
    viewer.setStyle({}, { stick: { radius: 0.15 }, sphere: { scale: 0.3 } });
    viewer.zoomTo();
    viewer.spin("y", 0.5); // 缓慢自转展示
    viewer.render();
  } catch {
    showFallback();
  }
}

// ===== 化学反应演示卡片(反应物 ⇌ 生成物 循环变换 3D 球棍模型) =====
function reactionCardHtml(rxnExpr) {
  // 反应 SMILES:反应物>条件>生成物,取首尾两段,小数点分隔多个物质
  const parts = rxnExpr.split(">");
  const reactants = (parts[0] || "").split(".").map(s => s.trim()).filter(Boolean).slice(0, 3);
  const products = (parts[parts.length - 1] || "").split(".").map(s => s.trim()).filter(Boolean).slice(0, 3);
  if (reactants.length === 0 || products.length === 0) return "";
  const molHtml = (list) => list.map(s =>
    `<div class="rxn-mol" data-smiles="${escapeHtml(s)}"><div class="mol-3d-loading">加载中…</div></div>`).join("");
  return `
    <div class="rxn-stage" title="每个分子均可拖拽旋转、滚轮缩放">
      <span class="rxn-label">反应物</span>
      <span class="rxn-label rxn-label-r">生成物</span>
      <div class="rxn-side">${molHtml(reactants)}</div>
      <span class="rxn-arrow-big">⟶</span>
      <div class="rxn-side">${molHtml(products)}</div>
    </div>`;
}

// 初始化反应演示:按 SMILES 从 PubChem 取 3D 坐标渲染小球棍查看器
async function initReaction(stage) {
  stage.querySelectorAll(".rxn-mol").forEach(async (el) => {
    const smiles = el.dataset.smiles;
    const showFallback = () => { el.innerHTML = `<div class="rxn-mol-fallback">${escapeHtml(smiles)}</div>`; };
    if (!window.$3Dmol) { showFallback(); return; }
    // SMILES 取 3D 坐标,失败则按名称再试(模型可能输出 CH4 这类非标准 SMILES)
    let sdf = "";
    for (const kind of ["smiles", "name"]) {
      try {
        const resp = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/${kind}/${encodeURIComponent(smiles)}/SDF?record_type=3d`);
        if (resp.ok) {
          const text = await resp.text();
          if (text && text.length >= 50) { sdf = text; break; }
        }
      } catch {}
    }
    if (!sdf) { showFallback(); return; }
    try {
      el.innerHTML = "";
      const viewer = window.$3Dmol.createViewer(el, { backgroundColor: "#f4f8fb" });
      viewer.addModel(sdf, "sdf");
      viewer.setStyle({}, { stick: { radius: 0.16 }, sphere: { scale: 0.3 } });
      viewer.zoomTo();
      viewer.spin("y", 0.5);
      viewer.render();
    } catch {
      showFallback();
    }
  });
}

// 从用户消息中识别分子结构查询意图:/mol X、/分子 X、「X的结构式」「生成X的分子式图像」等
function parseMoleculeQuery(text) {
  let m = text.match(/^\/(?:mol|分子)\s*[:：]?\s*(.+)$/i);
  if (m) return m[1].trim();
  m = text.match(/^(?:帮我|给我|我想看?|我想看看|请)?(?:画|生成|画出|显示|看看|查|做)?一?[下张个幅]?(.{1,24}?)(?:的)?(?:分子)?(?:结构式|结构图|结构|分子式|分子模型)(?:图|图像|可视化|的可视化图像)?[。!！？?]*$/);
  if (m) {
    const q = m[1].trim();
    // 排除代词/疑问词开头与"分子式"本身被当成化合物名的情况
    if (q && !/^(我|你|它|这|那|哪|什么|怎么|为什么)/.test(q) && !/^(分子式|结构式|结构图|分子|化合物)$/.test(q)) return q;
  }
  return null;
}

function formatToday() {

  return `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 · 星期${week}`;
}

function renderStats() {
  const existingTitles = new Set(newsData.map(n => n.title));
  const extraFavs = getLocalFavorites().filter(f => !existingTitles.has(f.title));
  const allItems = [...newsData, ...extraFavs];

  const importantCount = allItems.filter(item => item.important).length;
  const counts = { award: 0, product: 0, company: 0, research: 0 };
  allItems.forEach(item => { if (counts[item.type] !== undefined) counts[item.type]++; });
  heroStatsEl.innerHTML = `
    <span class="st-date">${formatToday()}</span>
    <span><span class="st-num">${total}</span> 条新闻</span>

function renderNews(filter = "all") {
  currentFilter = filter;
  let list;
  if (searchIndices !== null) {
    list = searchIndices.map(i => newsData[i]).filter(Boolean);
  } else if (filter === "favorites") {
    list = getLocalFavorites().map(f => ({ ...f, time: "★", important: false }));
  } else if (activeFilters.size > 0) {
    list = newsData.filter(item => activeFilters.has(item.type));
    const existingTitles = new Set(list.map(n => n.title));
    getLocalFavorites().forEach(f => {
      if (!existingTitles.has(f.title) && activeFilters.has(f.type)) list.push({ ...f, time: "★", important: false });
    });
  } else {
    list = [...newsData];
    const existingTitles = new Set(list.map(n => n.title));
    getLocalFavorites().forEach(f => {
      if (!existingTitles.has(f.title)) list.push({ ...f, time: "★", important: false });
    });
  }
  newsIndexMap = {};
  list.forEach((item, i) => { newsIndexMap[i] = item; });
  masonryEl.innerHTML = list.map((item, i) => newsTemplate(item, i)).join("");
  emptyEl.style.display = (filter !== "favorites" && list.length === 0) ? "block" : "none";
  favEmptyEl.style.display = (filter === "favorites" && list.length === 0) ? "block" : "none";
}

// AI 解读按钮
masonryEl.addEventListener("click", async (e) => {
  const btn = e.target.closest(".explain-btn");
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  const title = decodeURIComponent(btn.dataset.title);
  if (expandedExplains.has(title)) {
    expandedExplains.delete(title);
    renderNews(currentFilter);
    return;
  }
  if (explainCache[title]) {
    expandedExplains.add(title);
    renderNews(currentFilter);
    return;
  }
  btn.textContent = "解读中…";
  btn.disabled = true;
  try {
    const item = newsData.find(n => n.title === title);
    const resp = await fetch("/api/ai/explain", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title, summary: item ? item.summary : "" }),
    });
    if (resp.ok) {
      const json = await resp.json();
      if (json.code === 200 && json.data) {
        explainCache[title] = json.data;
        saveExplainCache();
        expandedExplains.add(title);
      }
    }
  } catch (err) { console.log("解读失败", err); }
  renderNews(currentFilter);
});

let rankingTimer = null;
let rankingPos = 0;
async function loadRanking() {
  try {
    const resp = await fetch("/api/ranking");
    let rankedItems = [];
    if (resp.ok) rankedItems = (await resp.json()).data || [];
    const rankedTitles = new Set(rankedItems.map(i => i.news_title));
    const unrankedNews = newsData
      .filter(n => !rankedTitles.has(n.title))
      .map(n => ({ news_title: n.title, news_url: n.url || "", news_source: n.source || "", news_type: n.type || "", favorite_count: 0 }));
    const allItems = [...rankedItems, ...unrankedNews].slice(0, 10);
    if (allItems.length === 0) {
      rankingCarouselEl.innerHTML = '<div class="ranking-loading">暂无新闻数据</div>';
      return;
    }
    rankingCarouselEl.innerHTML = `<div class="ranking-inner" id="rankingInner">` + allItems.map((item, i) => {
      const rank = i + 1;
      const isTop3 = rank <= 3;
      const rankItem = { title: item.news_title };
      const medal = rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : `${rank}`;
      return `
        <div class="ranking-card ${isTop3 ? "top3" : ""}">
          <div class="ranking-rank">${medal}</div>
          <div class="ranking-body">
            ${isTop3 ? '<span class="flame-icon"></span>' : ""}
            <a class="ranking-title ${isTop3 ? "top" + rank : ""}" href="${item.news_url || "#"}" target="_blank" rel="noopener">${escapeHtml(displayName(rankItem))}</a>
            <div class="ranking-meta">
              <span class="ranking-source">${escapeHtml(item.news_source || "")}</span>
              <span class="ranking-count">♡ ${item.favorite_count}</span>
            </div>
          </div>
        </div>`;
    }).join("") + `</div>`;
    const innerEl = $("rankingInner");
    if (rankingTimer) clearInterval(rankingTimer);
    rankingPos = 0;
    if (innerEl) innerEl.style.transform = "translateY(0)";
    if (allItems.length > 3 && innerEl) {
      rankingTimer = setInterval(() => {
        rankingPos++;
        if (rankingPos > allItems.length - 3) rankingPos = 0;
        innerEl.style.transform = `translateY(-${rankingPos * 88}px)`;
      }, 3000);
    }
  } catch (e) {
    rankingCarouselEl.innerHTML = '<div class="ranking-loading">排行榜加载失败</div>';
  }
}

async function runAISearch(query) {
  query = (query || "").trim();
  if (!query || newsData.length === 0) return;
  aiSearchBtn.disabled = true;
  aiSearchBtn.textContent = "搜索中…";
  try {
    const resp = await fetch("/api/ai/search", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, news: newsData.map(n => ({ title: n.title, summary: n.summary, type: n.type })) }),
    });
    const json = await resp.json();
    if (json.code === 200) {
      searchIndices = json.data || [];
      searchQueryText = query;
      activeFilters.clear();
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      document.querySelector('[data-filter="all"]').classList.add("active");
      aiSearchClear.style.display = "inline-block";
      renderNews("all");
      if (searchIndices.length === 0) {
        emptyEl.textContent = `没有找到与「${query}」相关的新闻。`;
        emptyEl.style.display = "block";
      } else {
        emptyEl.textContent = "当前分类暂无新闻。";
      }
    }
  } catch (err) { console.log("搜索失败", err); }
  aiSearchBtn.disabled = false;
  aiSearchBtn.textContent = "搜索";
}
function clearAISearch() {
  searchIndices = null;
  searchQueryText = "";
  aiSearchInput.value = "";
  aiSearchClear.style.display = "none";
  emptyEl.textContent = "当前分类暂无新闻。";
  renderNews("all");
}
aiSearchBtn.addEventListener("click", () => runAISearch(aiSearchInput.value));
aiSearchInput.addEventListener("keydown", (e) => { if (e.key === "Enter") runAISearch(aiSearchInput.value); });
aiSearchClear.addEventListener("click", clearAISearch);

      searchIndices = null;
      searchQueryText = "";
      aiSearchClear.style.display = "none";
      emptyEl.textContent = "当前分类暂无新闻。";

      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));

      activeFilters.clear();
      renderNews("favorites");
    } else if (f === "all") {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeFilters.clear();
      renderNews("all");
    } else {
      document.querySelector('[data-filter="all"]').classList.remove("active");
      document.querySelector('[data-filter="favorites"]').classList.remove("active");

      renderNews("all");
    }
  });
});

/* =========================================================
   Three.js 深空背景:星空 + 水面波纹鼠标效果
   ========================================================= */
(function initSpaceBackground() {
  if (!window.THREE) return;
  const canvas = $("bg-canvas");
  const compact = window.matchMedia("(max-width: 760px)").matches;
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: !compact, powerPreference: "high-performance" });
  renderer.setClearColor(0x000000, 0);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, compact ? 1.25 : 1.65));
  renderer.outputEncoding = THREE.sRGBEncoding;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 180);
  camera.position.set(0, 2.5, 27);
  camera.lookAt(0, 1.5, -8);
  const clock = new THREE.Clock();

  // 星空
  const starCount = compact ? 280 : 620;
  const positions = new Float32Array(starCount * 3);
  const colors = new Float32Array(starCount * 3);
  const palette = [new THREE.Color(0x62d9ff), new THREE.Color(0xa8f4ff), new THREE.Color(0xb39aff), new THREE.Color(0xf2d58b)];
  for (let i = 0; i < starCount; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 120;
    positions[i * 3 + 1] = (Math.random() - 0.5) * 70;
    positions[i * 3 + 2] = -Math.random() * 90 + 10;
    const c = palette[Math.floor(Math.random() * palette.length)];
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  starGeo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 0.16, vertexColors: true, transparent: true, opacity: 0.85, depthWrite: false }));
  scene.add(stars);

  // 漂浮的化学分子(球棍模型:发光原子 + 键线,缓慢旋转与上下浮动)
  const molecules = [];
  const molPalette = [0x62d9ff, 0xa78bfa, 0xf2d58b];
  const atomGeo = new THREE.SphereGeometry(0.09, 8, 8);
  function makeMolecule() {
    const group = new THREE.Group();
    const atomCount = 3 + Math.floor(Math.random() * 4); // 3~6 个原子
    const points = [];
    for (let i = 0; i < atomCount; i++) {
      const angle = (i / atomCount) * Math.PI * 2;
      const p = new THREE.Vector3(Math.cos(angle) * 0.42, Math.sin(angle) * 0.42, (Math.random() - 0.5) * 0.35);
      points.push(p);
      const atom = new THREE.Mesh(atomGeo, new THREE.MeshBasicMaterial({
        color: molPalette[i % molPalette.length],
        transparent: true, opacity: 0.55,
        blending: THREE.AdditiveBlending, depthWrite: false,
      }));
      atom.position.copy(p);
      group.add(atom);
    }
    const bondGeo = new THREE.BufferGeometry().setFromPoints([...points, points[0]]);
    group.add(new THREE.Line(bondGeo, new THREE.LineBasicMaterial({
      color: 0x67e8f9, transparent: true, opacity: 0.3,
      blending: THREE.AdditiveBlending, depthWrite: false,
    })));
    return group;
  }
  const molCount = compact ? 8 : 14;
  for (let i = 0; i < molCount; i++) {
    const m = makeMolecule();
    m.position.set((Math.random() - 0.5) * 46, (Math.random() - 0.5) * 26, -6 - Math.random() * 22);
    const s = 0.8 + Math.random() * 1.6;
    m.scale.setScalar(s);
    m.userData = {
      rotSpeed: (Math.random() - 0.5) * 0.5,
      bobSpeed: 0.25 + Math.random() * 0.5,
      phase: Math.random() * Math.PI * 2,
      baseY: m.position.y,
    };
    scene.add(m);
    molecules.push(m);
  }

  function resize() {
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.fov = window.innerWidth < 620 ? 57 : 50;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize, { passive: true });
  resize();

  (function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.05);
    const time = clock.elapsedTime;
    stars.rotation.y = time * 0.0018;
    molecules.forEach(m => {
      const d = m.userData;
      m.rotation.z += delta * d.rotSpeed;
      m.rotation.y += delta * d.rotSpeed * 0.6;
      m.position.y = d.baseY + Math.sin(time * d.bobSpeed + d.phase) * 0.7;
    });
    renderer.render(scene, camera);
  })();
})();

/* =========================================================
   鼠标水面波纹特效(顶层 2D 画布,浮于面板之上,不拦截交互)
   ========================================================= */
(function initRippleFX() {
  const canvas = $("fx-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize, { passive: true });
  resize();

  const ripples = [];
  let lastX = 0, lastY = 0, lastAt = 0;
  window.addEventListener("pointermove", (e) => {
    const now = performance.now();
    const dist = Math.hypot(e.clientX - lastX, e.clientY - lastY);
    if (dist < 14 || now - lastAt < 40) return;
    lastX = e.clientX; lastY = e.clientY; lastAt = now;
    ripples.push({
      x: e.clientX, y: e.clientY,
      age: 0,
      life: reducedMotion ? 0.5 : 1.1,
      maxR: 34 + Math.min(dist * 0.9, 46),
      brightness: Math.min(1, 0.7 + dist * 0.02),
    });
    if (ripples.length > 40) ripples.shift();
  }, { passive: true });

  let prev = performance.now();
  (function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - prev) / 1000, 0.05);
    prev = now;
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.age += dt;
      const p = r.age / r.life;
      if (p >= 1) { ripples.splice(i, 1); continue; }
      const fade = 1 - p;
      const easeOut = 1 - Math.pow(fade, 2.2);
      const baseR = 6 + (r.maxR - 6) * easeOut;
      // 三道同心涟漪,边缘正弦抖动模拟水面震动
      [1, 0.62, 0.34].forEach((f, k) => {
        const rr = baseR * f;
        if (rr < 2) return;
        ctx.beginPath();
        const seg = 26;
        for (let s = 0; s <= seg; s++) {
          const a = (s / seg) * Math.PI * 2;
          const wobble = Math.sin(a * 7 + p * 18) * 2.2;
          const px = r.x + Math.cos(a) * (rr + wobble);
          const py = r.y + Math.sin(a) * (rr + wobble);
          s === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath();
        const alpha = Math.pow(fade, 1.25) * r.brightness * (k === 0 ? 0.85 : k === 1 ? 0.5 : 0.3);
        ctx.strokeStyle = k === 0 ? `rgba(103,232,249,${alpha})` : `rgba(167,139,250,${alpha})`;
        ctx.lineWidth = k === 0 ? 2.2 : 1.4;
        ctx.stroke();
      });
    }
  })(prev);
})();

  motdCurrent = MOTD_LIST[Math.floor(Date.now() / 86400000) % MOTD_LIST.length];
  $("motdName").textContent = motdCurrent.name;
  $("motdFact").textContent = motdCurrent.fact;
  motdOverlay.hidden = false;
  // 3D 模型(PubChem 按名称取 3D 坐标,失败回退 2D 图)
  const box = $("motd3d");
  try {
    if (!window.$3Dmol) throw new Error("no lib");
    const resp = await fetch(`${PUBCHEM}/name/${encodeURIComponent(motdCurrent.q)}/SDF?record_type=3d`);
    if (!resp.ok) throw new Error("no 3d");
    const sdf = await resp.text();
    if (!sdf || sdf.length < 50) throw new Error("empty");
    box.innerHTML = "";
    const viewer = window.$3Dmol.createViewer(box, { backgroundColor: "#f4f8fb" });
    viewer.addModel(sdf, "sdf");
    viewer.setStyle({}, { stick: { radius: 0.15 }, sphere: { scale: 0.3 } });
    viewer.zoomTo();
    viewer.spin("y", 0.5);
    viewer.render();
  } catch {
    box.innerHTML = `<img src="${PUBCHEM}/name/${encodeURIComponent(motdCurrent.q)}/PNG" alt="${escapeHtml(motdCurrent.name)} 结构式">`;
  }
}
$("motdClose").addEventListener("click", () => { motdOverlay.hidden = true; });
$("motdOk").addEventListener("click", () => { motdOverlay.hidden = true; });
motdOverlay.addEventListener("click", (e) => { if (e.target === motdOverlay) motdOverlay.hidden = true; });
$("motdAsk").addEventListener("click", () => {
  motdOverlay.hidden = true;
  if (motdCurrent) handleUserText(`介绍一下${motdCurrent.name}:它是什么、有什么用途和有趣的性质?`);
});
